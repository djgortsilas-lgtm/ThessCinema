<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThessCinema</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fef9f0;--surface:#ffffff;--surface2:#fdf3e7;--primary:#e85d5d;--accent:#f5a623;--text:#2d2d2d;--text2:#888;--border:#f0e6d8;--rating-bg:#f5a623;--rating-color:#fff;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:#e85d5d;text-decoration:none}
a:hover{color:#d04444;text-decoration:underline}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
header h1 a{color:var(--primary);text-decoration:none}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:transparent;color:var(--text2);border:1px solid transparent;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.last-update{font-size:12px;color:var(--text2)}

main{max-width:1400px;margin:0 auto;padding:20px 16px}
.movies-grid{display:flex;flex-direction:column;gap:12px}
.movie-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all 0.2s;box-shadow:var(--shadow)}
.movie-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(245,166,35,0.15)}
.movie-card-inner{display:flex;gap:16px;padding:16px}
.movie-poster{flex-shrink:0;width:100px}
.movie-poster img{width:100px;height:auto;border-radius:6px;display:block}
.movie-info{flex:1;min-width:0}
.movie-info h2{font-size:18px;margin-bottom:4px}
.movie-info h2 a{color:var(--text)}
.movie-info h2 a:hover{color:var(--primary);text-decoration:none}
.movie-meta{font-size:13px;color:var(--text2);margin-bottom:6px}
.imdb-badge{display:inline-block;background:var(--rating-bg);color:var(--rating-color);padding:1px 8px;border-radius:4px;font-weight:700;font-size:12px;margin-right:6px}
.genre-tag{display:inline-block;background:#fdf3e7;color:#b87333;padding:1px 8px;border-radius:4px;font-size:12px;margin:1px 2px}
.movie-desc{font-size:14px;color:var(--text2);margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movie-cinemas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cinema-chip{display:inline-block;background:#fff5e6;color:#b87333;border:1px solid #f0dcc0;padding:2px 10px;border-radius:12px;font-size:12px}
.showtimes-panel{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface2);display:none}
.showtimes-panel.open{display:block}
.cinema-showtimes{margin-bottom:10px}
.cinema-showtimes h4{font-size:14px;margin-bottom:4px;color:#e85d5d}
.hall-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.hall-table th,.hall-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;vertical-align:top}
.hall-table th{background:#fdf3e7;color:#666;font-weight:600}
.hall-table td .time-slot{display:inline-block;background:#f5a623;color:#fff;padding:2px 8px;border-radius:4px;margin:1px;font-size:11px}
.hall-table td.empty{color:#ccc}
.timeline-header{position:sticky;top:60px;z-index:50;background:var(--bg);padding:8px 0;display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.day-pill{background:var(--surface);border:1px solid var(--border);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--text2);transition:all 0.2s;box-shadow:var(--shadow)}
.day-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-pill:hover{border-color:var(--accent)}
.timeline-day-content{padding:0 4px}
.timeline-cinema-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.timeline-cinema-title{font-size:15px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);color:#e85d5d}
.timeline-movie-entry{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.timeline-movie-entry:last-child{border-bottom:none}
.timeline-movie-entry:hover{background:var(--surface2)}
.timeline-movie-title{font-weight:600;font-size:14px;color:var(--text)}
.timeline-movie-hall{font-size:12px;color:var(--text2)}
.timeline-movie-times{margin-left:auto;font-size:13px;color:#e85d5d;white-space:nowrap}
.cinemas-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cinema-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.cinema-card h3{font-size:16px;margin-bottom:8px;color:#e85d5d}
.cinema-card .addr{font-size:12px;color:var(--text2);margin-bottom:8px}
.cinema-movie{font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.cinema-movie:last-child{border:none}
.cinema-movie-title{font-weight:600;color:var(--text);white-space:nowrap}
.cinema-movie-days{margin-top:2px;display:flex;flex-direction:column;gap:2px;width:100%}
.cinema-day-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.cinema-day{color:#b87333;font-weight:600;font-size:12px}
.cinema-day-times{font-size:12px;color:#e85d5d}
footer{text-align:center;padding:24px;color:var(--text2);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
.movie-poster{cursor:pointer}
.movie-poster img:hover{transform:scale(1.04);transition:transform 0.2s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.2s}
.modal-overlay.open{opacity:1}
.modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.3);transform:translateY(12px);transition:transform 0.2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;gap:16px;padding:16px;border-bottom:1px solid var(--border)}
.modal-poster{flex-shrink:0;width:130px}
.modal-poster img{width:130px;height:auto;border-radius:8px;display:block}
.modal-title-wrap{flex:1;min-width:0}
.modal-title{font-size:20px;line-height:1.3;margin:0 0 6px}
.modal-close{position:sticky;top:8px;float:right;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--text);z-index:2}
.modal-body{padding:16px}
.modal-desc{font-size:14px;color:var(--text);margin-bottom:12px;white-space:pre-wrap}
.modal-facts{font-size:13px;color:var(--text2);margin:6px 0}
.modal-facts b{color:var(--text)}
.modal-trailer{display:inline-block;background:#ff0000;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;margin-top:8px}
.modal-trailer:hover{background:#d00000;color:#fff;text-decoration:none}
@media(max-width:768px){
  .header-inner{flex-direction:column;align-items:stretch}
  nav{justify-content:center}
  .movie-card-inner{flex-direction:column;align-items:center;text-align:center}
  .movie-poster{width:80px}
  .movie-poster img{width:80px}
  .movie-cinemas{justify-content:center}
  .timeline-grid{grid-template-columns:120px 1fr}
}
</style>
</head>

er Two, The Eyes of Tammy Faye) πρωταγωνιστεί σε διπλό ρόλο, ως μητέρα της Μπέλα αλλά και ως η «Άλλη Μαμά», η ενσάρκωση της μυστηριώδους οντότητας. Ο Τζέι Ντουπλάς (Transparent, Industry) υποδύεται τον Ντάντο (Daddo), τον πατέρα της Μπέλα, ενώ η Αραμπέλα Ολίβια Κλαρκ (The Housemaid, The Hand that Rocks the Cradle) ενσαρκώνει την Μπέλα. Το εντυπωσιακό καστ συμπληρώνουν η Ντίτσεν Λάχμαν (Dichen Lachman) (Severance), υποψήφια για Actor Award, ο υποψήφιος για Emmy και Tony, Άριαν Μοαγέντ (Succession), καθώς και η θρυλική ηθοποιός Κάρεν Άλεν, γνωστή από τις ταινίες Indiana Jones. Την ταινία Άλλη Μαμά σκηνοθετεί ο Ρομπ Σάβατζ (Host, The Boogeyman), σε σενάριο του βραβευμένου Νέιθαν Έλστον, σεναριογράφου της πολυβραβευμένης με Emmy σειράς: Succession. Την παραγωγή υπογράφει ο Τζέιμς Γουάν (Saw, Insidious και The Conjuring), για λογαριασμό της Blumhouse Atomic Monster, και την εκτέλεση παραγωγής οι Μάικλ Κλιαρ, Τζάντσον Σκοτ, Ρομπ Σάβατζ, Τζος Μάλερμαν και Ράιαν Λιούις.", "cast": "Τζέσικα Τσαστέιν, Τζέι Ντουπλάς, Αραμπέλα Ολίβια Κλαρκ, Ντίτσεν Λάχμαν, Άριαν Μοαγέντ, Κάρεν Άλεν, Σον Κάουφμαν, Τρέιβις Νέλσον, Χάλεϊ Σπίλμαν, Άλεκ Σικαρίνου, Άνταμ Σίλβερ, Ρόζι Άν Ο Γκόρμαν", "director": "Ρομπ Σάβατζ", "writer": "Νέιθαν Ήλστον, Τζος Μέιλερμαν", "trailer": "https://www.youtube.com/watch?v=vMRNxUo0J3s", "cinemas": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}, {"name": "Odeon Πλατεία", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-plateia/"}, {"name": "Village Μακεδονία Mall (Πρώην Options)", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-makedonia/"}, {"name": "Village Cosmos", "url": "https://www.thessalonikiguide.gr/cinemas/village-cosmos/"}, {"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}], "showtimes": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "phone": "Τηλ. 2310233665, 2310233669", "halls": πο με τον οποίο υπολογίζονταν οι αναμενόμενες απώλειες αμάχων πριν από αεροπορικά πλήγματα. Η ταινία στηρίζεται επίσης σε δημοσιογραφικές έρευνες που δημοσιεύτηκαν από το 2023 έως το 2025 στον Guardian, το +972 Magazine και το Local Call. Σημείωμα των σκηνοθετών: Κάναμε αυτή την ταινία από αίσθηση χρέους: να αξιοποιήσουμε τη θέση μας ως Ισραηλινοί κινηματογραφιστές και δημοσιογράφοι, ώστε να εξετάσουμε τα συστήματα πίσω από τη μαζική εξόντωση Παλαιστινίων αμάχων, για την οποία ευθύνεται η χώρα μας. Καθώς γυρίζαμε, τα τελευταία τρία χρόνια, μέλη του ισραηλινού στρατού σε ταράτσες του Τελ Αβίβ μέσα στη νύχτα, βρεθήκαμε να θέτουμε τα ίδια ακριβώς ερωτήματα που έθεσε η γενιά των παππούδων μας και που διατρέχουν ολόκληρο τον 20ό αιώνα: πώς επιτρέπει μια ομάδα ανθρώπων την ολοκληρωτική απανθρωποποίηση μιας άλλης; Πώς μοιάζει η λειτουργία ενός τέτοιου συστήματος εκ των έσω; Πολλές από τις αποκαλύψεις της ταινίας δημοσιεύτηκαν σχεδόν αμέσως μόλις τις μάθαμε, τους μήνες που ακολούθησαν τις επιθέσεις της 7ης Οκτωβρίου, από τον Guardian — έναν από τους παραγωγούς του NAZA — σε συνεργασία με τα +972 Magazine και Local Call. Η ταινία μάς επιτρέπει να διερευνήσουμε κάτι βαθύτερο από όσο μπορούσε μόνη της η ερευνητική μας δημοσιογραφία: όχι μόνο τα λόγια που λέγονται, αλλά και εκείνα που δεν λέγονται – τη σιωπή. Είναι στο χέρι όλων μας να σπάσουμε αυτή τη σιωπή.", "cast": "Γιούβαλ Άμπραχαμ", "director": "Γιουβάλ Άμπραχαμ, Ρέιτσελ Σζορ", "writer": "Γιουβάλ Άμπραχαμ, Ρέιτσελ Σζορ", "trailer": "", "cinemas": [{"name": "Ολύμπιον", "url": "https://www.thessalonikiguide.gr/cinemas/olympion/"}, {"name": "Μακεδονικόν", "url": "https://www.thessalonikiguide.gr/cinemas/makedonikon/"}, {"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/"}], "showtimes": [{"name": "Ολύμπιον", "url": "https://www.thessalonikiguide.gr/cinemas/olympion/", "address": "Πλατεία Αριστοτέλους 10, Θεσσαλονίκη", "phone": "Τηλ. 2310 378 400", "halls": [{"name": "Αίθουσα Ολύμπιον", "days  συναισθήματα του συγκροτήματος και των οπαδών του σε όλο τον κόσμο. Η μοναδική αυτή ματιά περιλαμβάνει πρόσβαση στις πρόβες, στα παρασκήνια και επί σκηνής, καθώς και τις πρώτες κοινές συνεντεύξεις του Noel και του Liam μετά από πάνω από 20 χρόνια. Παράλληλα με την παγκόσμια περιοδεία της μπάντας, η οποία ξεπούλησε αμέσως, το ντοκιμαντέρ διερευνά και τον βαθύ συναισθηματικό αντίκτυπο αυτής της παγκόσμιας πολιτιστικής στιγμής – φαινόμενο και το τι σημαίνει η μουσική των Oasis για το κοινό και τις γενιές σε όλο τον κόσμο. Ο Steven Knight δηλώνει: «Η παγκόσμια περιοδεία των Oasis ένωσε γενιές, πολιτισμούς και χώρες και μίλησε σε έναν διχασμένο κόσμο για τη συμφιλίωση. Το ντοκιμαντέρ αυτό δεν είναι απλώς το εισιτήριό σας για τη συναυλία – είναι μια πρόσβαση στα παρασκήνια με τους Liam και Noel να είναι μαζί για πρώτη φορά μετά από 15 χρόνια και να αφηγούνται όσα έζησαν τότε και πού βρίσκονται τώρα».", "cast": "Oasis", "director": "Γουίλ Λαβλέις, Ντύλαν Σάουθερν", "writer": "Στήβεν Νάιτ", "trailer": "https://www.youtube.com/watch?v=yq_kRiFEY3Q", "cinemas": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}], "showtimes": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "phone": "Τηλ. 2310233665, 2310233669", "halls": [{"name": "Αίθουσα 2", "days": ["Πε 15/10", "Πα 16/10", "Σα 17/10", "Κυ 18/10", "Δε 19/10", "Τρ 20/10", "Τε 21/10"], "showtimes": [[[], [], [], [], [], ["20:00"], []]]}]}]}, {"title": "Στην Καρδιά του Κτήνους (Heart of the Beast)", "detail_url": "https://www.thessalonikiguide.gr/tainia/stin-kardia-toy-ktinous-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/07/stin-kardia-toy-ktinous-120x180.jpg", "imdb": "7,2", "genres": ["Δραματική", "Δράσης", "Περιπέτεια"], "year": "2026", "description": "Μετά από μια τραγική αεροπορική συντριβή, ο αξιωματικός των Ειδικών Δυνάμεων Τζέιμς Μπελμόν (Μπραντ Πιτ) και ο σκύλος μάχης του, Οντίν, βρ loads/2026/06/the-plague-120x180.jpg", "imdb": "6,4", "genres": ["Δραματική", "Ψυχολογικό Δράμα"], "year": "2025", "description": "Σε μία κατασκήνωση πόλο μόνο για αγόρια, ένας ευαίσθητος 12χρονος, ο Μπεν, έρχεται αντιμέτωπος με μια σκληρή παράδοση που βάζει στο στόχαστρο έναν περιθωριοποιημένο κατασκηνωτή, τον Ιλάι. Καθώς τα όρια μεταξύ παιχνιδιού και πραγματικότητας θολώνουν, φοβάται ότι πίσω από αυτό το αστείο μπορεί να κρύβεται κάτι πιο σοβαρό… Ο Μπεν έχει μόλις μετακομίσει στην πόλη μετά το διαζύγιο των γονιών του, και είναι προφανές ότι δεν ταιριάζει με τους άλλους, οι οποίοι είναι θορυβώδεις, χυδαίοι, αλαζόνες και πεπεισμένοι ότι ο Ιλάι πάσχει από μια μυστηριώδη ασθένεια που αποκαλούν «την πανούκλα». Αν τον αγγίξεις, την κολλάς… Το δίλημμα είναι απολύτως σαφές: ο εκκεντρικός Ιλάι μπορεί να είναι ο μόνος που ο Μπεν πραγματικά συμπαθεί, αλλά φοβάται τόσο πολύ να χάσει την κοινωνική του θέση στην ομάδα ώστε να μην τολμά να τον υπερασπιστεί. Δεν θέλει να γίνει ένας από τους ισχυρούς, αλλά απολαμβάνει το πώς είναι να νιώθει ότι είναι ένας από αυτούς… Καθώς όμως σιγά σιγά παρασύρεται σε όλο αυτό το «παιχνίδι», οι «φίλοι» του στρέφονται εναντίον του και εκείνος στρέφεται εναντίον τους μέχρι το απροσδόκητα αιματηρό τέλος της ταινίας.", "cast": "Έβερετ Μπλανκ, Τζόελ Έτζερτον, Κέννυ Ράσμουσεν, Έλιοτ Χεφερναν, Λένοξ Έσπι, Κέιο Μάρτιν, Κέιντεν Μπούρις, Λούκας Άντλερ, Κόλτον Λι", "director": "Τσάρλι Πόλινγκερ", "writer": "Τσάρλι Πόλινγκερ", "trailer": "https://www.youtube.com/watch?v=inkrZcxh-10", "cinemas": [{"name": "Cine Άλεξ (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/cine-alex/"}], "showtimes": [{"name": "Cine Άλεξ (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/cine-alex/", "address": "Αγ.Σοφίας & Ολύμπου 106, Θεσσαλονίκη", "phone": "Τηλ. 2310 269403", "halls": [{"name": "Αίθουσα", "days": ["Πε 15/10", "Πα 16/10", "Σα 17/10", "Κυ 18/10", "Δε 19/10", "Τρ 20/10", "Τε 21/10"], "showtimes": [[["22:15"], ["22:15"], [], [], [], [], []]]}]}]}, {"title": "Οδύσσεια (The Odyssey)", "detail_url": "https://www.thessalonikiguide.gr/tainia/the-odyssey-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/06/odysseia-2026-120x180.jpg", "imdb": "8,4", "genres": ["Δραματική", "Επική Περιπέτεια", "Περιπέτεια", "Ρομαντική", "Φαντασίας"], "year": "2026", "description": "Η νέα ταινία του Κρίστοφερ Νόλαν, Οδύσσεια, είναι μία μυθική επική περιπέτεια με γυρίσματα σε όλο τον κόσμο και προσαρμογή του ομότιτλου επικού ποιήματος του Ομήρου. Στην ταινία Οδύσσεια πρωταγωνιστεί ο Ματ Ντέιμον ως ο Οδυσσέας, ο Αρχαίος Έλληνας βασιλιάς της Ιθάκης και η ιστορία έχει να κάνει με την επιστροφή του στην πατρίδα του μετά από τον Τρωικό Πόλεμο για να ξανασμίξει με τη γυναίκα του, Πηνελόπη (Αν Χάθαγουεϊ). Το υπόλοιπο βασικό καστ συμπληρώνουν οι Τομ Χόλλαντ (Τηλέμαχος),  Ζεντάγια (Θεά Αθηνά), Λουπίτα Νιόνγκο (Ωραία Ελένη – Κλυταιμνήστρα), Ρόμπερτ Πάτινσον (Αντίνοος) και Σαρλίζ Θερόν (Καλυψώ). Η Οδύσσεια ακολουθεί τον Οδυσσέα, τον θρυλικό Έλληνα βασιλιά της Ιθάκης, στο επικίνδυνο επικό ταξίδι προς την πατρίδα του, την Ιθάκη μετά από τον Τρωικό Πόλεμο, όπου συναντά τον Κύκλωπα Πολύφημο, τις Σειρήνες και την μάγισσα θεά Κίρκη, ως και την επανένωσή του με τη γυναίκα του, Πηνελόπη και τον γιο του Τηλέμαχο. Τα γυρίσματα της ταινίας Οδύσσεια του 2026, ξεκίνησαν τον Φεβρουάριο του 2025, στο Μαρόκο, στην Ιταλία, στην Ελλάδα, Ηνωμένο Βασίλειο, Μάλτα, Σκωτία, Ισλανδία, Σαχάρα και οι τελευταίες σκηνές πραγματοποιήθηκαν στο Λος Άντζελες. Με υπολογισμένο κόστος παραγωγής τα $250 εκατομμύρια, θα είναι η πιο ακριβή ταινία του Νόλαν. Τα γυρίσματα διήρκεσαν 91 ημέρες, από τον Φεβρουάριο έως τον Αύγουστο του 2025, και ολοκληρώθηκαν εννέα ημέρες νωρίτερα από το χρονοδιάγραμμα. Τα γυρίσματα σε εξωτερικούς χώρους πραγματοποιήθηκαν κυρίως σε έξι χώρες: το Μαρόκο, την Ελλάδα, την Ιταλία, την Ισλανδία, τη Σκωτία και τις Ηνωμένες Πολιτείες. Η «Οδύσσεια» έγινε η πρώτη ταινία μεγάλου μήκους που γυρίστηκε εξ ολοκλήρου με κινηματογραφικές κάμερες IMAX, χρησιμοποιώντας κυρίως μια νέα, ελαφρύτερη και πιο αθόρυβη έκδοση που ο Νόλαν είχε αναπτύξει ειδικά για την παραγωγή. Η επιλογή της Κενυάτισσας ηθοποιού Λουπίτα Νιόνγκο για τον ρόλο της Ωραίας Ελένης —που θεωρείται η ομορφότερη γυναίκα στον κόσμο— δέχτηκε ιδιαίτερη κριτική από συντηρητικούς σχολιαστές.", "cast": "Ματ Ντέιμον, Τομ Χόλαντ, Αν Χάθαγουεϊ, Ρόμπερτ Πάτινσον, Λουπίτα Νιόνγκο, Ζεντάγια, Σαρλίζ Θερόν, Τζον Μπέρνθαλ, Έλιοτ Πέιτζ, Ράιαν Χερστ, Τζον Στιούαρτ, Λόγκαν Μάρσαλ Γκριν, Μία Γκοθ, Τζον Λεγκουιζάμο, Τζέιμς Ρεμαρ, Σαμάνθα Μόρτον, Μπένι Σαφντι", "director": "Κρίστοφερ Νόλαν", "writer": "Κρίστοφερ Νόλαν, βασισμένο στο Ομηρικό Έπος Οδύσσεια", "trailer": "https://www.youtube.com/watch?v=YJw4t5gpMB8", "cinemas": [{"name": "Δημ. Κιν. Κορδελιού - Εύοσμου", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-kordelio-evosmos/"}, {"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}, {"name": "Odeon Πλατεία", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-plateia/"}], "showtimes": [{"name": "Δημ. Κιν. Κορδελιού - Εύοσμου", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-kordelio-evosmos/", "address": "Μεγάλου Αλεξάνδρου 57, Εύοσμος", "phone": "Τηλ. 2310 202 067, 2310 762 400", "halls": [{"name": "Αίθουσα", "days": ["Πε 15/10", "Πα 16/10", "Σα 17/10", "Κυ 18/10", "Δε 19/10", "Τρ 20/10", "Τε 21/10"], "showtimes": [[[], [], [], ["20:30"], [], [], []]]}]}, {"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "phone": "Τηλ. 2310233665, 2310233669", "halls": [{"name": "Αίθουσα 1", "days": ["Πε 15/10", "Πα 16/10", "Σα 17/10", "Κυ 18/10", "Δε 19/10", "Τρ 20/10", "Τε 21/10"], "showtimes": [[[], [], [], ["15:00"], [], [], []]]}]}, {"name": "Odeon Πλατεία", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-plateia/", "address": "Τσιμισκη 43, Θεσσαλονίκη", "phone": "Τηλ. 14560 με χρέωση ανά λεπτό 0,49€ (από σταθερό) και 0,99€ (από function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className') e.className = v;
    else if (k === 'textContent') e.textContent = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function summerIcon(name) { return name.includes('Θερινός') ? '☀️ ' + name : name; }

function renderShowtimes(panel, cinemas) {
  if (!cinemas.length) { panel.append(el('p',{style:'color:var(--text2);font-size:13px'},'Δεν υπάρχουν προβολές για αυτή την εβδομάδα.')); return; }
  for (const c of cinemas) {
    const block = el('div',{className:'cinema-showtimes'},
      el('h4',{},summerIcon(c.name)),
      c.address ? el('div',{style:'font-size:11px;color:var(--text2);margin-bottom:4px'},c.address) : null
    );
    for (const hall of (c.halls||[])) {
      if (!hall.days || !hall.days.length) continue;
      const table = el('table',{className:'hall-table'});
      const thead = el('tr');
      for (const d of hall.days) thead.append(el('th',{},d));
      table.append(thead);
      for (const rowTimes of (hall.showtimes||[])) {
        const tr = el('tr');
        for (let i = 0; i < Math.max(hall.days.length, rowTimes.length); i++) {
          const times = rowTimes[i] || [];
          if (!times.length) { tr.append(el('td',{className:'empty'},'—')); }
          else { const td = el('td',{}); for (const t of times) td.append(el('span',{className:'time-slot'},t)); tr.append(td); }
        }
        table.append(tr);
      }
      block.append(table);
    }
    panel.append(block);
  }
}

function showMovieModal(m) {
  const existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  const overlay = el('div',{className:'modal-overlay'});
  const closeBtn = el('button',{className:'modal-close','aria-label':'Κλείσιμο'},'×');
  const ps = m.poster && !m.poster.includes('data:image') ? m.poster : '';
  const imdbH = m.imdb ? '<span class="imdb-badge">IMDb '+esc(m.imdb)+'</span>' : '';
  const trailerUrl = m.trailer || 'https://www.youtube.com/results?search_query='+encodeURIComponent(m.title+' trailer');
  const facts = [];
  if (m.year) facts.push(el('p',{className:'modal-facts'},el('b',{},'Έτος: '),m.year));
  if (m.director) facts.push(el('p',{className:'modal-facts'},el('b',{},'Σκηνοθεσία: '),m.director));
  if (m.writer) facts.push(el('p',{className:'modal-facts'},el('b',{},'Σενάριο: '),m.writer));
  if (m.cast) facts.push(el('p',{className:'modal-facts'},el('b',{},'Ηθοποιοί: '),m.cast));
  const genres = (m.genres||[]).map(g => el('span',{className:'genre-tag'},g));
  const modal = el('div',{className:'modal'},
    el('div',{className:'modal-header'},
      closeBtn,
      el('div',{className:'modal-poster'}, ps ? el('img',{src:ps,alt:m.title}) : null),
      el('div',{className:'modal-title-wrap'},
        el('h2',{className:'modal-title'},m.title),
        el('div',{className:'movie-meta',innerHTML:imdbH}),
        el('div',{style:'margin-top:4px'},...genres)
      )
    ),
    el('div',{className:'modal-body'},
      m.description ? el('p',{className:'modal-desc'},m.description) : null,
      ...facts,
      el('a',{className:'modal-trailer',href:trailerUrl,target:'_blank',rel:'noopener'},'▶ Δείτε τρέιλερ')
    )
  );
  overlay.append(modal);
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  function close() {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 200);
  }
  closeBtn.onclick = close;
  document.addEventListener('keydown', function escKey(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escKey); }
  });
}

    let open = false;

      if (open && !panel.hasChildNodes()) {

      const times = new Set();
      for (const row of (hall.showtimes||[])) {
        if (row[dayIdx] && row[dayIdx].length) for (const t of row[dayIdx]) times.add(t);
      }
      if (times.size) result.push({cinema: c.name, hall: hall.name, times: [...times]});
    }
  }
  return result;
}

function renderTimelineView() {
  const container = el('div',{});
  const dayHeader = el('div',{className:'timeline-header'});
  const dAbbrs = ['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'];
  const today = new Date();
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const idx = d.getDay() === 0 ? 6 : d.getDay() - 1;
    weekDays.push({date:d, abbr:dAbbrs[idx], label:dAbbrs[idx]+' '+d.getDate()+'/'+(d.getMonth()+1)});
  }
  let activeDay = 0;
  function buildDayContent(dayIdx) {
    const dayLabel = weekDays[dayIdx].abbr;
    const wrapper = el('div',{className:'timeline-day-content'});
    const cinemaMap = {};
    for (const m of MOVIES_DATA) {
      const entries = getTimesForMovieDay(m, dayLabel);
      for (const e of entries) {
        if (!cinemaMap[e.cinema]) cinemaMap[e.cinema] = [];
        cinemaMap[e.cinema].push({title:m.title, hall:e.hall, times:e.times, movie:m});
      }
    }
    if (!Object.keys(cinemaMap).length) {
      wrapper.append(el('p',{style:'color:var(--text2);text-align:center;padding:24px'},'Δεν υπάρχουν προβολές για αυτή την ημέρα.'));
      return wrapper;
    }
    for (const [cn, items] of Object.entries(cinemaMap).sort()) {
      const section = el('div',{className:'timeline-cinema-section'},
        el('h3',{className:'timeline-cinema-title'},summerIcon(cn))
      );
      for (const item of items) {
        const entry = el('div',{className:'timeline-movie-entry'});
        entry.append(el('span',{className:'timeline-movie-title'},item.title));
        if (item.hall !== 'Αίθουσα') entry.append(el('span',{className:'timeline-movie-hall'},'('+item.hall+')'));
        entry.append(el('span',{className:'timeline-movie-times'},item.times.join(', ')));
        entry.onclick = () => { document.querySelectorAll('.tab')[0].click(); setTimeout(()=>{for(const card of document.querySelectorAll('.movie-card')){if(card.textContent.includes(item.title)){card.scrollIntoView({behavior:'smooth',block:'center'});const b=card.querySelector('.showtimes-toggle');if(b)b.click();break}}},100) };
        section.append(entry);
      }
      wrapper.append(section);
    }
    return wrapper;
  }
  for (let i = 0; i < weekDays.length; i++) {
    const pill = el('button',{className:'day-pill'+(i===activeDay?' active':''),textContent:weekDays[i].label});
    pill.onclick = () => { dayHeader.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); activeDay = i; const old=container.querySelector('.timeline-day-content'); if(old) old.remove(); container.append(buildDayContent(activeDay)); };
    dayHeader.append(pill);
  }
  container.append(dayHeader);
  container.append(buildDayContent(0));
  return container;
}

function getShowtimesForCinema(movie, cinemaName) {
  const st = (movie.showtimes||[]).find(c => c.name === cinemaName);
  if (!st || !st.halls || !st.halls.length) return null;
  const dayMap = {};
  for (const hall of st.halls) {
    const days = hall.days || [];
    const rows = hall.showtimes || [];
    for (let di = 0; di < days.length; di++) {
      if (!dayMap[days[di]]) dayMap[days[di]] = new Set();
      for (const row of rows) {
        if (row[di] && row[di].length) for (const t of row[di]) dayMap[days[di]].add(t);
      }
    }
  }
  return dayMap;
}

function renderCinemasView() {
  const container = el('div',{className:'cinemas-list'});
  const cm = {};
  for (const m of MOVIES_DATA) {
    for (const c of (m.cinemas||[])) {
      if (!cm[c.name]) cm[c.name] = {name:c.name, entries:[]};
      cm[c.name].entries.push(m);
    }
  }
  for (const [name,data] of Object.entries(cm).sort()) {
    const card = el('div',{className:'cinema-card'},el('h3',{},summerIcon(name)));
    for (const m of data.entries) {
      const line = el('div',{className:'cinema-movie'});
      line.append(el('span',{className:'cinema-movie-title'},m.title));
      const dayMap = getShowtimesForCinema(m, name);
      const timesWrap = el('div',{className:'cinema-movie-days'});
      if (dayMap && Object.keys(dayMap).length) {
        for (const [dayLabel, times] of Object.entries(dayMap)) {
          const dayLine = el('div',{className:'cinema-day-line'});
          dayLine.append(el('span',{className:'cinema-day'},dayLabel + ': '));
          dayLine.append(el('span',{className:'cinema-day-times'},[...times].join(', ')));
          timesWrap.append(dayLine);
        }
      }
      line.append(timesWrap);
      card.append(line);
    }
    container.append(card);
  }
  return container;
}

// ---- Refresh logic ----

async function tryFetch(url, timeoutMs) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(id);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.text();
  } catch(e) {
    clearTimeout(id);
    throw e;
  }
}

async function fetchShowtimesForMovie(url) {
  const slug = url.split('/').filter(s=>s).pop();
  try {
    const txt = await tryFetch('http://localhost:8765/api/movies/'+slug, 5000);
    const data = JSON.parse(txt);
    if (data && data.cinemas && data.cinemas.length) return data.cinemas;
  } catch(e) { /* backend not available */ }
  // CORS proxy fallback (may not work with this site)
  let html = '';
  for (const proxy of CORS_PROXIES) {
    try { html = await tryFetch(proxy + encodeURIComponent(url), 15000); if (html.length > 2000) break; }
    catch(e) { continue; }
  }
  if (!html || html.length < 2000 || !html.includes('python-table')) return [];
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = doc.querySelectorAll('table.python-table.text-center');
  const cinemas = [];
  for (const table of tables) {
    const container = table.closest('.cine-table-sc') || table.parentElement;
    const prev = container?.previousElementSibling;
    const cinemaNameEl = prev?.querySelector('h4, h3, strong, .title') || prev;
    const cinemaName = cinemaNameEl ? cinemaNameEl.textContent.trim() : 'Αίθουσα';
    const addrEl = prev?.querySelector('.address, .addr, [class*="address"], [class*="addr"], p');
    const address = addrEl ? addrEl.textContent.trim() : '';
    const cinema = { name: cinemaName, address, halls: [] };
    const tbody = table.querySelector('tbody');
    if (!tbody) continue;
    const rows = tbody.querySelectorAll('tr');
    if (rows.length < 2) continue;
    const dayCells = rows[1].querySelectorAll('th, td');
    let days = [...dayCells].map(c => c.textContent.trim()).filter(Boolean);
    if (!days.length) {
      for (let i = 0; i < (rows[0]?.querySelectorAll('th, td').length || 7); i++) days.push('Ημέρα '+(i+1));
    }
    const hallGroups = [];
    let i = 0;
    while (i < rows.length) {
      const rowCells = rows[i].querySelectorAll('th, td');
      let hallName = '';
      let colspan = 0;
      for (const cell of rowCells) {
        const cs = parseInt(cell.getAttribute('colspan') || '1');
        colspan += cs;
        const txt = cell.textContent.trim();
        if (cs >= 4 && txt && !txt.match(/^\d{1,2}:\d{2}/)) hallName = txt;
      }
      if (colspan >= 4 && hallName) {
        const group = { name: hallName, rows: [] };
        i++;
        while (i < rows.length) {
          const nextCells = rows[i].querySelectorAll('td');
          if (nextCells.length < 4) break;
          const timeRow = [];
          for (const cell of nextCells) {
            const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
            timeRow.push(times.length ? times : []);
          }
          group.rows.push(timeRow);
          i++;
        }
        hallGroups.push(group);
      } else {
        i++;
      }
    }
    if (!hallGroups.length && days.length) {
      const showtimes = [];
      for (let r = 2; r < rows.length; r++) {
        const timeRow = [];
        for (const cell of rows[r].querySelectorAll('td')) {
          const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
          timeRow.push(times.length ? times : []);
        }
        if (timeRow.some(t => t.length)) showtimes.push(timeRow);
      }
      if (showtimes.length) cinema.halls.push({ name: 'Αίθουσα', days, showtimes });
    } else {
      for (const g of hallGroups) cinema.halls.push({ name: g.name, days, showtimes: g.rows });
    }
    cinemas.push(cinema);
  }
  return cinemas;
}



async function refreshFromGitHub() {
  if (!GITHUB_USER || GITHUB_USER.startsWith('YOUR')) return;
  try {
    const r = await fetch(GITHUB_DATA_URL, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    const data = await r.json();
    if (Array.isArray(data) && data.length && data[0].showtimes) {
      MOVIES_DATA.length = 0;
      SHOWTIMES_CACHE.clear();
      for (const m of data) MOVIES_DATA.push(m);
      const now = new Date();
      document.querySelector('.last-update').textContent =
        now.getDate().toString().padStart(2,'0')+'/'+
        ((now.getMonth()+1).toString().padStart(2,'0'))+'/'+
        now.getFullYear()+' '+now.getHours().toString().padStart(2,'0')+':'+
        now.getMinutes().toString().padStart(2,'0');
    }
  } catch(e) { /* offline or not configured */ }
}

function init() {
  const content = document.getElementById('content');
  content.append(renderColumnView());
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      content.innerHTML = '';
      const v = tab.dataset.view;
      if (v === 'column') content.append(renderColumnView());
      else if (v === 'timeline') content.append(renderTimelineView());
      else content.append(renderCinemasView());
    };
  });
  refreshFromGitHub();
}
init();
