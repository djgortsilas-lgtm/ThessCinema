name: Auto-scrape Thessaloniki Cinema

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml

      - name: Scrape & build
        working-directory: server
        run: |
          python ci_build.py

      - name: Commit updated files
        run: |
          git config user.name "thesscinema-bot"
          git config user.email "bot@thesscinema.local"
          git add server/snapshot.json server/ThessCinema.html server/static/index.html
          cp server/ThessCinema.html ThessCinema.html
          git add ThessCinema.html
          git diff --staged --quiet || git commit -m "auto: refresh cinema data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
