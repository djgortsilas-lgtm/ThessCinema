<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThessCinema</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fef9f0;--surface:#ffffff;--surface2:#fdf3e7;--primary:#e85d5d;--accent:#f5a623;--text:#2d2d2d;--text2:#888;--border:#f0e6d8;--rating-bg:#f5a623;--rating-color:#fff;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:#e85d5d;text-decoration:none}
a:hover{color:#d04444;text-decoration:underline}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
header h1 a{color:var(--primary);text-decoration:none}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:transparent;color:var(--text2);border:1px solid transparent;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.last-update{font-size:12px;color:var(--text2)}

main{max-width:1400px;margin:0 auto;padding:20px 16px}
.movies-grid{display:flex;flex-direction:column;gap:12px}
.movie-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all 0.2s;box-shadow:var(--shadow)}
.movie-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(245,166,35,0.15)}
.movie-card-inner{display:flex;gap:16px;padding:16px}
.movie-poster{flex-shrink:0;width:100px}
.movie-poster img{width:100px;height:auto;border-radius:6px;display:block}
.movie-info{flex:1;min-width:0}
.movie-info h2{font-size:18px;margin-bottom:4px}
.movie-info h2 a{color:var(--text)}
.movie-info h2 a:hover{color:var(--primary);text-decoration:none}
.movie-meta{font-size:13px;color:var(--text2);margin-bottom:6px}
.imdb-badge{display:inline-block;background:var(--rating-bg);color:var(--rating-color);padding:1px 8px;border-radius:4px;font-weight:700;font-size:12px;margin-right:6px}
.genre-tag{display:inline-block;background:#fdf3e7;color:#b87333;padding:1px 8px;border-radius:4px;font-size:12px;margin:1px 2px}
.movie-desc{font-size:14px;color:var(--text2);margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movie-cinemas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cinema-chip{display:inline-block;background:#fff5e6;color:#b87333;border:1px solid #f0dcc0;padding:2px 10px;border-radius:12px;font-size:12px}
.showtimes-panel{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface2);display:none}
.showtimes-panel.open{display:block}
.cinema-showtimes{margin-bottom:10px}
.cinema-showtimes h4{font-size:14px;margin-bottom:4px;color:#e85d5d}
.hall-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.hall-table th,.hall-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;vertical-align:top}
.hall-table th{background:#fdf3e7;color:#666;font-weight:600}
.hall-table td .time-slot{display:inline-block;background:#f5a623;color:#fff;padding:2px 8px;border-radius:4px;margin:1px;font-size:11px}
.hall-table td.empty{color:#ccc}
.timeline-header{position:sticky;top:60px;z-index:50;background:var(--bg);padding:8px 0;display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.day-pill{background:var(--surface);border:1px solid var(--border);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--text2);transition:all 0.2s;box-shadow:var(--shadow)}
.day-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-pill:hover{border-color:var(--accent)}
.timeline-day-content{padding:0 4px}
.timeline-cinema-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.timeline-cinema-title{font-size:15px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);color:#e85d5d}
.timeline-movie-entry{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.timeline-movie-entry:last-child{border-bottom:none}
.timeline-movie-entry:hover{background:var(--surface2)}
.timeline-movie-title{font-weight:600;font-size:14px;color:var(--text)}
.timeline-movie-hall{font-size:12px;color:var(--text2)}
.timeline-movie-times{margin-left:auto;font-size:13px;color:#e85d5d;white-space:nowrap}
.cinemas-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cinema-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.cinema-card h3{font-size:16px;margin-bottom:8px;color:#e85d5d}
.cinema-card .addr{font-size:12px;color:var(--text2);margin-bottom:8px}
.cinema-movie{font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.cinema-movie:last-child{border:none}
.cinema-movie-title{font-weight:600;color:var(--text);white-space:nowrap}
.cinema-movie-days{margin-top:2px;display:flex;flex-direction:column;gap:2px;width:100%}
.cinema-day-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.cinema-day{color:#b87333;font-weight:600;font-size:12px}
.cinema-day-times{font-size:12px;color:#e85d5d}
footer{text-align:center;padding:24px;color:var(--text2);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
.movie-poster{cursor:pointer}
.movie-poster img:hover{transform:scale(1.04);transition:transform 0.2s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.2s}
.modal-overlay.open{opacity:1}
.modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.3);transform:translateY(12px);transition:transform 0.2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;gap:16px;padding:16px;border-bottom:1px solid var(--border)}
.modal-poster{flex-shrink:0;width:130px}
.modal-poster img{width:130px;height:auto;border-radius:8px;display:block}
.modal-title-wrap{flex:1;min-width:0}
.modal-title{font-size:20px;line-height:1.3;margin:0 0 6px}
.modal-close{position:sticky;top:8px;float:right;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--text);z-index:2}
.modal-body{padding:16px}
.modal-desc{font-size:14px;color:var(--text);margin-bottom:12px;white-space:pre-wrap}
.modal-facts{font-size:13px;color:var(--text2);margin:6px 0}
.modal-facts b{color:var(--text)}
.modal-trailer{display:inline-block;background:#ff0000;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;margin-top:8px}
.modal-trailer:hover{background:#d00000;color:#fff;text-decoration:none}
@media(max-width:768px){
  .header-inner{flex-direction:column;align-items:stretch}
  nav{justify-content:center}
  .movie-card-inner{flex-direction:column;align-items:center;text-align:center}
  .movie-poster{width:80px}
  .movie-poster img{width:80px}
  .movie-cinemas{justify-content:center}
  .timeline-grid{grid-template-columns:120px 1fr}
}
</style>
</head>

-content/uploads/2026/09/i-pio-ploysia-gynaika-ston-kosmo-120x180.jpg", "imdb": "6,3", "genres": ["Βιογραφική", "Δραματική", "Κομεντί"], "year": "2025", "description": "Η σπουδαία Ιζαμπέλ Ιπέρ είναι η πλουσιότερη γυναίκα στον κόσμο – και πρωταγωνίστρια ενός αληθινού, διαβόητου σκανδάλου που συγκλόνισε τη Γαλλία. Μια απολαυστική ιστορία εξουσίας, χρήματος και χειραγώγησης, που έκανε παγκόσμια πρεμιέρα στο Φεστιβάλ Καννών, στο επίσημο πρόγραμμα – εκτός συναγωνισμού. Βραβείο Σεζάρ Καλύτερης Αντρικής Ερμηνείας 2026 για τον Λοράν Λαφίτ. Η Μαριάν Φαρέρ, κληρονόμος μιας αμύθητης αυτοκρατορίας καλλυντικών , μοιάζει να τα έχει όλα, εκτός από αγάπη και ελευθερία. Όταν γνωρίζει τον Πιερ-Αλέν Φαντέν, έναν εκκεντρικό και φιλόδοξο φωτογράφο, κατά τη διάρκεια μιας φωτογράφισης, ανάμεσά τους γεννιέται μια φιλία απρόβλεπτη, αμφίσημη και επικίνδυνη. Εκείνος της προσφέρει μια διέξοδο από τη χρυσή φυλακή της ζωής της, ενώ εκείνη του ανοίγει την πόρτα σε έναν κόσμο αμύθητου πλούτου και προνομίων. Όσο η έλξη και η εξάρτηση μεταξύ τους μεγαλώνουν, τόσο η Μαριάν τού χαρίζει όλο και περισσότερα, εκνευρίζοντας τον περίγυρό της. Πίσω όμως από τις κλειστές πόρτες της πιο ισχυρής οικογένειας της Γαλλίας, όλοι έχουν κάτι να κρύψουν: μια κόρη που παλεύει να προστατεύσει τη μητέρα της, ένας μπάτλερ που γνωρίζει περισσότερα απ’ όσα λέει, και μια οικογένεια με μυστικά που χάνονται στα χρόνια του πολέμου. Καθώς η σχέση της Μαριάν και του Πιερ-Αλέν εξελίσσεται σε δημόσιο σκάνδαλο, οι δυο τους βρίσκονται στο κέντρο ενός αδυσώπητου παιχνιδιού εξουσίας, χρήματος και χειραγώγησης, όπου τίποτα δεν είναι όπως φαίνεται – και όπου, τελικά, ο μεγαλύτερος πλούτος μπορεί να είναι και η μεγαλύτερη κατάρα. Ένα διαβόητο σκάνδαλο: Η «περίφημη υπόθεση Μπετανκούρ» υπήρξε ένα από τα μεγαλύτερα δημόσια σκάνδαλα της σύγχρονης Γαλλίας, ένα οικογενειακό δράμα που μετατράπηκε σε πολιτικό θρίλερ και απασχόλησε επί χρόνια τα τοπικά και διεθνή μέσα ενημέρωσης. Στο επίκεντρο βρέθηκε η Λιλιάν Μπετανκούρ, η κληρονόμος της αυτοκρατορίας της L’Oréal και επί χρόνια η πλουσιότερη γυναίκα στον κόσμο, με περιουσία που ξεπερνούσε τα 40 δισεκατομμύρια ευρώ. Η στενή σχέση της με τον φωτογράφο και συγγραφέα Φρανσουά-Μαρί Μπανιέ, στον οποίο φέρεται να χάρισε σχεδόν ένα δισεκατομμύριο δολάρια σε χρήματα, έργα τέχνης και ακίνητα, προκάλεσε σφοδρή σύγκρουση με την κόρη της, Φρανσουάζ, η οποία κατηγόρησε τον καλλιτέχνη για χειραγώγηση και «κατάχρηση αδυναμίας» της ηλικιωμένης Μπετανκούρ. Πολύ σύντομα, όμως, η υπόθεση ξέφυγε από τα όρια μιας διαμάχης για την κληρονομιά: ήρθαν στο φως καταγγελίες για φοροδιαφυγή, υπεράκτιους τραπεζικούς λογαριασμούς και παράνομες χρηματοδοτήσεις της προεκλογικής εκστρατείας του πρώην προέδρου της Γαλλικής Δημοκρατίας, Νικολά Σαρκοζί. Σε μια χώρα όπου, όπως λέει και η ταινία, «οι άνθρωποι μισούν τους πλούσιους», η υπόθεση έγινε σύμβολο της αδιαφάνειας, της εξουσίας και της παρακμής της γαλλικής ελίτ. Πάνω σε αυτό το υλικό χτίζει την «Πλουσιότερη Γυναίκα στον Κόσμο» ο Τιερί Κλιφά , ο οποίος συνυπογράφει το σενάριο μαζί με τον Σεντρίκ Ανζέ και τον Ζακ Φιεσί. Ο Κλιφά, που ξεκίνησε την καριέρα του ως δημοσιογράφος, κινείται συχνά ανάμεσα στο δράμα, το οικογενειακό μελόδραμα και το πορτρέτο ισχυρών, συχνά αντιφατικών χαρακτήρων: από το «Une vie à t’attendre» και το «Le Héros de la famille» μέχρι το πρόσφατο «Les rois de la piste», οι ταινίες του εξερευνούν τις σχέσεις εξουσίας, τις οικογενειακές ρωγμές και τα πρόσωπα που κρύβονται πίσω από τη δημόσια εικόνα. Παράλληλα, έχει συνεργαστεί στενά με μερικές από τις σημαντικότερες μορφές του γαλλικού σινεμά, όπως η Κατρίν Ντενέβ, η Ναταλί Μπαγιέ και η Φανί Αρντάν. Στον πρωταγωνιστικό ρόλο της νέας του ταινίας, ευτύχησε να έχει τη μοναδική Ιζαμπέλ Ιπέρ, μία από τις σπουδαιότερες και πιο καταξιωμένες ηθοποιούς του ευρωπαϊκού κινηματογράφου. Με μια καριέρα που εκτείνεται σε περισσότερες από πέντε δεκαετίες και ερμηνείες σε ταινίες όπως τα «Δασκάλα του Πιάνου», «Μια Υπόθεση Γυναικών» και «Elle» μεταξύ πολλών άλλων, η Ιπέρ έχει αποδείξει ξανά και ξανά την ικανότητά της να ενσαρκώνει γυναίκες σύνθετες, αινιγματικές και αμφιλεγόμενες. Και ως Μαριάν Φαρέρ (το κινηματογραφικό alter ego της Μπετανκούρ) ισορροπεί αριστοτεχνικά ανάμεσα στην επιβλητική ψυχραιμία και σε μια σχεδόν παιδική ανάγκη για τρυφερότητα και προσοχή ως μια «βασίλισσα» που μοιάζει να χάνεται μέσα στο ίδιο της το παλάτι. Περισσότερο από μια απλή αναπαράσταση ενός διάσημου σκανδάλου, η «Πλουσιότερη Γυναίκα στον Κόσμο» μετατρέπει μια ιστορία για δισεκατομμύρια, πολιτική και οικογενειακές ίντριγκες σε ένα σκοτεινά κωμικό, σχεδόν σατιρικό πορτρέτο. Και με φόντο έναν κόσμο εκλεπτυσμένης πολυτέλειας, σαν μια γαλλική εκδοχή του «Succession», έρχεται να μας θυμίσει ότι πίσω από κάθε αμύθητη περιουσία μπορεί να κρύβεται κάτι αναπάντεχα επικίνδυνο: η απόλυτη μοναξιά.", "cast": "Ιζαμπέλ Ιπέρ, Λοράν Λαφίτ, Μαρινά Φουά, Ραφαέλ Περσονάζ, Αντρέ Μαρκόν, Ματιέ Ντεμί", "director": "Τιερί Κλιφά", "writer": "Σεντρίκ Ανζέ, Ζακ Φιεσί, Τιερί Κλιφά", "trailer": "https://www.youtube.com/watch?v=fdMaHUodTGk", "cinemas": [{"name": "Σινέ Ναταλί (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/natali/"}, {"name": "Κολοσσαίον", "url": "https://www.thessalonikiguide.gr/cinemas/kolossaion/"}, {"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}], "showtimes": [{"name": "Σινέ Ναταλί (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/natali/", "address": "Λεωφ. Μεγάλου Αλεξάνδρου 3, Θεσσαλονίκη", "phone": "Τηλ. 2310 829457", "halls": [{"name": "Αίθουσα", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[[], [], ["21:20"], [], ["21:30"], [], []]]}]}, {"name": "Κολοσσαίον", "url": "https://www.thessalonikiguide.gr/cinemas/kolossaion/", "address": "Βασιλίσσης Όλγας 150, Θεσσαλονίκη", "phone": "Τηλ. 2310 834996", "halls": [{"name": "Αίθουσα", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[[], [], [], [], ["17:00"], ["17:00 IlcyhOac", "cinemas": [{"name": "Σινέ Πανόραμα (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/cine-panorama/"}], "showtimes": [{"name": "Σινέ Πανόραμα (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/cine-panorama/", "address": "1ο χλμ. Οδού Πανοράματος-Θέρμης", "phone": "Τηλ. 2310 346 720", "halls": [{"name": "Αίθουσα", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[["20:00"], ["20:00"], ["20:00"], ["20:00"], [], [], []]]}]}]}, {"title": "Ο Παραχαράκτης (The Money Maker / L’Affaire Bojarski)", "detail_url": "https://www.thessalonikiguide.gr/tainia/paraxaraktis-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/08/paraxaraktis-120x180.jpg", "imdb": "7", "genres": ["Αστυνομική", "Βιογραφική", "Δραματική", "Ιστορική"], "year": "2026", "description": "Ποιος ήταν ο «Σεζάν του πλαστού χρήματος», ο μυστηριώδης άνδρας που ξεγέλασε ακόμη και την Τράπεζα της Γαλλίας, ενώ τα πλαστά του χαρτονομίσματα θεωρούνται πια συλλεκτικής αξίας; Έχοντας ξεπεράσει το 1 εκατομμύριο εισιτήρια, το L’ Affaire Bojarski είναι η μεγάλη επιτυχία του φετινού γαλλικού Box- Office, Στη μεταπολεμική Γαλλία, ένας Πολωνός πρόσφυγας αναγκάζεται να μετατρέψει το σπάνιο ταλέντο του στη μηχανική σε όπλο επιβίωσης. Ο Γιαν Μπογιάρσκι φτάνει στη Γαλλία χωρίς πατρίδα και χωρίς επίσημη ταυτότητα: όταν το κράτος τού αρνείται την αναγνώριση και τα διπλώματα ευρεσιτεχνίας που δικαιούται, εκείνος θα βρει έναν άλλο τρόπο να αποδείξει την αξία του. Μέσα σε ένα αυτοσχέδιο εργαστήριο, δημιουργεί σχεδόν τέλεια πλαστά χαρτονομίσματα: τόσο άψογα που μπορούν να ξεγελάσουν ακόμη και την Τράπεζα της Γαλλίας. Καθώς χτίζει μια διπλή ζωή, κρυφή ακόμη και από την οικογένειά του, η παρανομία μετατρέπεται σε προσωπικό στοίχημα τελειότητας και αναγνώρισης. Απέναντί του, ο αμείλικτος αστυνόμος Ματέι αφιερώνει χρόνια στην καταδίωξή του, στήνοντας ένα υπόγειο, εμμονικό παιχνίδι γάτας και ποντικιού, σε ένα συναρπαστικό αστυνομικό δράμα βασισμένο σε αληθινή ιστορία, για έναν άνθρωπο που ήθελε να αναγνωριστεί ως δημιουργός – ακόμη κι αν η αναγνώριση αυτή θα ήταν συνώνυμη με τη σύλληψή του. Η ιστορία του «Σεζάν του πλαστού χρήματος»: Ο Γιαν Μπογιάρσκι (1912–2003), Πολωνός μηχανικός και αρχιτέκτονας που εγκαταστάθηκε στη Γαλλία μετά τον Β΄ Παγκόσμιο Πόλεμο, υπήρξε ο εγκέφαλος μίας από τις πιο εντυπωσιακές υποθέσεις παραχάραξης του 20ού αιώνα. Στα τέλη της δεκαετίας του 1950 και στις αρχές του 1960, δούλευε απομονωμένος στο υπόγειο του σπιτιού του, όπου κατασκεύαζε ο ίδιος τα πάντα: από το χαρτί και τις πλάκες εκτύπωσης, μέχρι τα μηχανήματα και το μελάνι. Το αποτέλεσμα ήταν πλαστά γαλλικά φράγκα εξαιρετικής ποιότητας, τόσο πειστικά που μπορούσαν να ξεγελάσουν ακόμη και τους ειδικούς της Τράπεζας της Γαλλίας, επίδοση που του χάρισε το προσωνύμιο «ο Σεζάν του πλαστού χρήματος». Για περισσότερα από 14 χρόνια, ο Μπογιάρσκι διοχέτευε στην αγορά εκατομμύρια φράγκα, μέχρι τη σύλληψή του το 1964, έπειτα από προδοσία συνεργατών που είχαν αναλάβει την κυκλοφορία των χαρτονομισμάτων. Καταδικάστηκε σε πολυετή κάθειρξη και η υπόθεσή του απασχόλησε εκτενώς τον γαλλικό Τύπο, με πολλούς να τον αντιμετωπίζουν όχι μόνο ως εγκληματία, αλλά και ως ιδιοφυή τεχνίτη με σχεδόν καλλιτεχνική εμμονή στην τελειότητα. Σήμερα, τα πλαστά του χαρτονομίσματα θεωρούνται κειμήλια και η περίπτωσή του εξακολουθεί να μελετάται από ειδικούς στην καταπολέμηση της παραχάραξης. Η ταινία φέρει την υπογραφή του Ζαν-Πολ Σαλομέ, δημιουργού πίσω από τα «Αρσέν Λουπέν, ο Άνθρωπος με τα Χίλια Πρόσωπα» με πρωταγωνιστή τον Ρομάν Ντουρί και του πολιτικού θρίλερ «Εύκολος Στόχος» με πρωταγωνίστρια την Ιζαμπέλ Ιπέρ, που έκανε πρεμιέρα στο Φεστιβάλ Βενετίας. Με την ταινία αυτή, ο Σαλομέ παρουσιάζει μια ιστορία που ισορροπεί με μαεστρία ανάμεσα στο αστυνομικό θρίλερ και το δράμα, συνδυάζοντας τη, γεμάτη σασπένς, δομή ενός «παιχνιδιού» γάτας και ποντικιού με μια λεπτομερή, σχεδόν ντοκιμαντερίστικη αποτύπωση της τέχνης της παραχάραξης. Στον κεντρικό ρόλο, ιρία και τα συναισθήματα του συγκροτήματος και των οπαδών του σε όλο τον κόσμο. Η μοναδική αυτή ματιά περιλαμβάνει πρόσβαση στις πρόβες, στα παρασκήνια και επί σκηνής, καθώς και τις πρώτες κοινές συνεντεύξεις του Noel και του Liam μετά από πάνω από 20 χρόνια. Παράλληλα με την παγκόσμια περιοδεία της μπάντας, η οποία ξεπούλησε αμέσως, το ντοκιμαντέρ διερευνά και τον βαθύ συναισθηματικό αντίκτυπο αυτής της παγκόσμιας πολιτιστικής στιγμής – φαινόμενο και το τι σημαίνει η μουσική των Oasis για το κοινό και τις γενιές σε όλο τον κόσμο. Ο Steven Knight δηλώνει: «Η παγκόσμια περιοδεία των Oasis ένωσε γενιές, πολιτισμούς και χώρες και μίλησε σε έναν διχασμένο κόσμο για τη συμφιλίωση. Το ντοκιμαντέρ αυτό δεν είναι απλώς το εισιτήριό σας για τη συναυλία – είναι μια πρόσβαση στα παρασκήνια με τους Liam και Noel να είναι μαζί για πρώτη φορά μετά από 15 χρόνια και να αφηγούνται όσα έζησαν τότε και πού βρίσκονται τώρα».", "cast": "Oasis", "director": "Γουίλ Λαβλέις, Ντύλαν Σάουθερν", "writer": "Στήβεν Νάιτ", "trailer": "https://www.youtube.com/watch?v=yq_kRiFEY3Q", "cinemas": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}, {"name": "Village Cosmos", "url": "https://www.thessalonikiguide.gr/cinemas/village-cosmos/"}], "showtimes": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/", "address": "Γιαννιτσών 61 & Κωλέττη 34, Θεσσαλονίκη", "phone": "Τηλ. 2310 515351", "halls": [{"name": "Αίθουσα 7", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[["18:30"], ["18:30"], ["18:30"], ["18:30"], ["18:30"], ["18:30"], ["18:30"]]]}]}, {"name": "Village Cosmos", "url": "https://www.thessalonikiguide.gr/cinemas/village-cosmos/", "address": "Mediterranean Cosmos, Θεσσαλονίκη", "phone": "Τηλ. 2310487810", "halls": [{"name": "Αίθουσα 2", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[[], [" ερικούς χώρους πραγματοποιήθηκαν κυρίως σε έξι χώρες: το Μαρόκο, την Ελλάδα, την Ιταλία, την Ισλανδία, τη Σκωτία και τις Ηνωμένες Πολιτείες. Η «Οδύσσεια» έγινε η πρώτη ταινία μεγάλου μήκους που γυρίστηκε εξ ολοκλήρου με κινηματογραφικές κάμερες IMAX, χρησιμοποιώντας κυρίως μια νέα, ελαφρύτερη και πιο αθόρυβη έκδοση που ο Νόλαν είχε αναπτύξει ειδικά για την παραγωγή. Η επιλογή της Κενυάτισσας ηθοποιού Λουπίτα Νιόνγκο για τον ρόλο της Ωραίας Ελένης —που θεωρείται η ομορφότερη γυναίκα στον κόσμο— δέχτηκε ιδιαίτερη κριτική από συντηρητικούς σχολιαστές.", "cast": "Ματ Ντέιμον, Τομ Χόλαντ, Αν Χάθαγουεϊ, Ρόμπερτ Πάτινσον, Λουπίτα Νιόνγκο, Ζεντάγια, Σαρλίζ Θερόν, Τζον Μπέρνθαλ, Έλιοτ Πέιτζ, Ράιαν Χερστ, Τζον Στιούαρτ, Λόγκαν Μάρσαλ Γκριν, Μία Γκοθ, Τζον Λεγκουιζάμο, Τζέιμς Ρεμαρ, Σαμάνθα Μόρτον, Μπένι Σαφντι", "director": "Κρίστοφερ Νόλαν", "writer": "Κρίστοφερ Νόλαν, βασισμένο στο Ομηρικό Έπος Οδύσσεια", "trailer": "https://www.youtube.com/watch?v=YJw4t5gpMB8", "cinemas": [{"name": "Κολοσσαίον", "url": "https://www.thessalonikiguide.gr/cinemas/kolossaion/"}, {"name": "Δημ. Κιν. Νεάπολης - Συκεών", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-neapolis-sykeon/"}, {"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}, {"name": "Odeon Πλατεία", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-plateia/"}, {"name": "Village Μακεδονία Mall (Πρώην Options)", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-makedonia/"}, {"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}, {"name": "Village Cosmos", "url": "https://www.thessalonikiguide.gr/cinemas/village-cosmos/"}, {"name": "Σινέ Ωραιόκαστρο (Θερινός)", "url": "https://www.thessalonikiguide.gr/cinemas/cine-oraiokastro/"}], "showtimes": [{"name": "Κολοσσαίον", "url": "https://www.thessalonikiguide.gr/cinemas/kolossaion/", "address": "Βασιλίσσης Όλγας 150, Θεσσαλονίκη", "phone": "Τηλ. 2310 834996", "halls": [{"name": "Αίθουσα",  και τα 99 ακόμα σκυλάκια, από τα χέρια της κακιάς Κρουέλα! Το έργο Τα 101 Σκυλιά της Δαλματίας αντλεί την έμπνευσή του από το ομώνυμο μυθιστόρημα της Ντόντι Σμιθ (1956), και αποτελεί την δέκατη έβδομη ταινία μεγάλου μήκους στο πλαίσιο της σειράς Τα Κλασσικά της Ντίσνεϋ. Έκανε την πρεμιέρα της στις αίθουσες το 1961. Μετά την κυκλοφορία είχε εμπορική επιτυχία, βγάζοντας το στούντιο από την οικονομική δυσκολία, στην οποία βρισκόταν μετά την αποτυχία της Ωραίας Κοιμωμένης, μια δαπανηρή παραγωγή, που κυκλοφόρησε δύο χρόνια νωρίτερα. Η ταινία επανακυκλοφόρησε στις κινηματογραφικές αίθουσες τέσσερις φορές, το 1969, το 1979, το 1985 και το 1991. Η επανακυκλοφορία του 1991 την έκανε την 20η ταινία της χρονιάς με τα μεγαλύτερα έσοδα. Η ταινία Τα 101 Σκυλιά της Δαλματίας ξαναδημιουργήθηκε, αυτή τη φορά ως live-action ταινία, το 1996.", "cast": "Με τις φωνές των: Τάσος Μασμανίδης, Ματίνα Καρρά, Μαρία Μαρτίκα, Δημήτρης Κοντογιάννης, Χλόη Λιάσκου, Τάκης Μηλιάδης, Αλέξης Σταυράκης, Μιχάλης Μαραγκάκης, Ηλίας Καπετανίδης, Βασίλης Πλατάκης, Γιώργος Βελέντζας, Μάκης Πανώριος, Ρίκα Σηφάκη, Σάσα Καζέλη, Χριστίνα Στόγια, Γιώργος Βερλής, Ελένη Δακορώνια, Λουκάς Μεταξάς, Όλια Λαζαρίδου, Ρένα Καζάκου, Βάσω Σέχη, Άριελ Κωνσταντινίδη, Τόνια Βυθούλκα", "director": "Βόλφγκανγκ Ράιτερμαν, Χάμιλτον Σ. Λάσκε, Κλάιντ Τζερόνιμι", "writer": "Μπιλ Πιτ, Ντόντι Σμιθ", "trailer": "https://www.youtube.com/watch?v=rKCEyXoPNEU", "cinemas": [{"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/"}], "showtimes": [{"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/", "address": "Σαρανταπόρου 4, Θεσσαλονίκη", "phone": "Τηλ. 2310 828642", "halls": [{"name": "Disney Classics", "days": ["Πε 10/9", "Πα 11/9", "Σα 12/9", "Κυ 13/9", "Δε 14/9", "Τρ 15/9", "Τε 16/9"], "showtimes": [[[], [], ["20:00"], [], [], [], []]]}]}]}, {"title": "Στάλκερ (Stalker)", "detail_url": "https://www.thessalonikiguide.gr/tainia/stalker-1979/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2023/11/stalker-1979-120x180.jpg", "imdb": "8", "genres": ["Sci-Fi", "Δραματική", "Δυστοπία", "Ψυχολογικό Δράμα"], "year": "1979", "description": "Η ταινία Στάλκερ είναι βασισμένη στη νουβέλα Roadside Picnic των Μπόρις και Αρκάντι Στρουγκάρσκι. Σε ένα σύμπαν που λειτουργεί με κανόνες που ξεφεύγουν από την ανθρώπινη λογική και κατανόηση, η παρατήρηση του κόσμου, η έννοια της πίστης και η προσωπική ενδοσκόπηση του Ταρκόφσκι βρίσκουν έκφραση στο σμίλευμα του χρόνου (η αποκορύφωση του καλλιτεχνικού οράματος του Ταρκόφσκι, όπως μαρτυρά και το διάσημο βιβλίο του, Σμιλεύοντας τον χρόνο). Στάλκερ ονομάζεται ο ξεναγός-κυνηγός, ο οποίος υποδεικνύει το δρόμο προς την απαγορευμένη περιοχή, τη Ζώνη. Όταν βρίσκεται εκεί, ο ανώνυμος αυτός άνδρας καθοδηγεί τους περιπλανώμενους για να γλιτώσουν από αόρατες παγίδες και να διασχίσουν τον δικό τους ψυχικό λαβύρινθο μέχρι το κατώφλι του Δωματίου: μόλις το διαβούν, εκείνο θα τους προσφέρει απλόχερα τις πιο κρυφές τους επιθυμίες. Ο Στάλκερ, ξεκινά το ταξίδι προς τη Ζώνη μαζί με έναν συγγραφέα και έναν επιστήμονα, που τον μισθώνουν για να τους οδηγήσει εκεί. Η ζώνη είναι ένας τόπος αλλόκοτος, που αλλάζει συνεχώς την μορφή του. Οι τρεις ταξιδιώτες βρίσκονται συνεχώς σε κίνδυνο που παραμονεύει παντού. Ποιος τολμάει όμως, να έρθει αντιμέτωπος με τις πιο μύχιες επιθυμίες του;", "cast": "Ανατόλι Σολονίτσιν, Αλίσα Φρέιντλιχ, Νικολάι Γκρίνκο, Αλεξάντερ Καϊντανόφσκι, Ράιμο Ρέντι, Νατάσα Αμπράμοβα", "director": "Αντρέι Ταρκόφσκι", "writer": "Αντρέι Ταρκόφσκι, Μπορίς Στρουγκάτσκι, Αρκάντι Στρουγκάτσκι", "trailer": "https://www.youtube.com/watch?v=YIGytT7VJJ4", "cinemas": [{"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/"}], "showtimes": [{"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/", "address": "Σαρανταπόρου 4, Θεσσαλονίκη", "phone": "Τηλ. 2310 828642", "halls": [{"name": "Αφιέρωμα στον Αντρέι Ταρκόφσκι", "days": ["Πε 10/9", "Πα 11/9", "Σα function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className') e.className = v;
    else if (k === 'textContent') e.textContent = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function summerIcon(name) { return name.includes('Θερινός') ? '☀️ ' + name : name; }

function renderShowtimes(panel, cinemas) {

      el('h4',{},summerIcon(c.name)),
      c.address ? el('div',{style:'font-size:11px;color:var(--text2);margin-bottom:4px'},c.address) : null
    );
    for (const hall of (c.halls||[])) {
      if (!hall.days || !hall.days.length) continue;
      const table = el('table',{className:'hall-table'});
      const thead = el('tr');
      for (const d of hall.days) thead.append(el('th',{},d));
      table.append(thead);
      for (const rowTimes of (hall.showtimes||[])) {
        const tr = el('tr');
        for (let i = 0; i < Math.max(hall.days.length, rowTimes.length); i++) {
          const times = rowTimes[i] || [];

        }
        table.append(tr);
      }
      block.append(table);
    }
    panel.append(block);
  }
}

function getTimesForMovieDay(movie, dayLabel) {
  const result = [];
  for (const c of (movie.showtimes||[])) {
    for (const hall of (c.halls||[])) {
      const dayIdx = (hall.days||[]).findIndex(d => d.includes(dayLabel));
      if (dayIdx < 0) continue;
      const times = new Set();
      for (const row of (hall.showtimes||[])) {
        if (row[dayIdx] && row[dayIdx].length) for (const t of row[dayIdx]) times.add(t);
      }
      if (times.size) result.push({cinema: c.name, hall: hall.name, times: [...times]});
    }
  }
  return result;
}

function getShowtimesForCinema(movie, cinemaName) {
  const st = (movie.showtimes||[]).find(c => c.name === cinemaName);
  if (!st || !st.halls || !st.halls.length) return null;
  const dayMap = {};
  for (const hall of st.halls) {
    const days = hall.days || [];
    const rows = hall.showtimes || [];
    for (let di = 0; di < days.length; di++) {
      if (!dayMap[days[di]]) dayMap[days[di]] = new Set();
      for (const row of rows) {
        if (row[di] && row[di].length) for (const t of row[di]) dayMap[days[di]].add(t);
      }
    }
  }
  return dayMap;
}

async function tryFetch(url, timeoutMs) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(id);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.text();
  } catch(e) {
    clearTimeout(id);
    throw e;
  }
}

            const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
            timeRow.push(times.length ? times : []);
          }
          group.rows.push(timeRow);
          i++;
        }
        hallGroups.push(group);
      } else {
        i++;
      }
    }
    if (!hallGroups.length && days.length) {
      const showtimes = [];
      for (let r = 2; r < rows.length; r++) {
        const timeRow = [];
        for (const cell of rows[r].querySelectorAll('td')) {
          const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
          timeRow.push(times.length ? times : []);
        }
        if (timeRow.some(t => t.length)) showtimes.push(timeRow);
      }
      if (showtimes.length) cinema.halls.push({ name: 'Αίθουσα', days, showtimes });
    } else {
      for (const g of hallGroups) cinema.halls.push({ name: g.name, days, showtimes: g.rows });
    }
    cinemas.push(cinema);
  }
  return cinemas;
}



async function refreshFromGitHub() {
  if (!GITHUB_USER || GITHUB_USER.startsWith('YOUR')) return;
  try {
    const r = await fetch(GITHUB_DATA_URL, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    const data = await r.json();
    if (Array.isArray(data) && data.length && data[0].showtimes) {
      MOVIES_DATA.length = 0;
      SHOWTIMES_CACHE.clear();
      for (const m of data) MOVIES_DATA.push(m);
      const now = new Date();
      document.querySelector('.last-update').textContent =
        now.getDate().toString().padStart(2,'0')+'/'+
        ((now.getMonth()+1).toString().padStart(2,'0'))+'/'+
        now.getFullYear()+' '+now.getHours().toString().padStart(2,'0')+':'+
        now.getMinutes().toString().padStart(2,'0');
    }
  } catch(e) { /* offline or not configured */ }
}

function init() {
  const content = document.getElementById('content');
  content.append(renderColumnView());
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      content.innerHTML = '';
      const v = tab.dataset.view;
      if (v === 'column') content.append(renderColumnView());
      else if (v === 'timeline') content.append(renderTimelineView());
      else content.append(renderCinemasView());
    };
  });
  refreshFromGitHub();
}
init();
</script>
