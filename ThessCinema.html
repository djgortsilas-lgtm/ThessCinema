<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThessCinema</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fef9f0;--surface:#ffffff;--surface2:#fdf3e7;--primary:#e85d5d;--accent:#f5a623;--text:#2d2d2d;--text2:#888;--border:#f0e6d8;--rating-bg:#f5a623;--rating-color:#fff;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:#e85d5d;text-decoration:none}
a:hover{color:#d04444;text-decoration:underline}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
header h1 a{color:var(--primary);text-decoration:none}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:transparent;color:var(--text2);border:1px solid transparent;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all 0.2s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.last-update{font-size:12px;color:var(--text2)}

main{max-width:1400px;margin:0 auto;padding:20px 16px}
.movies-grid{display:flex;flex-direction:column;gap:12px}
.movie-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all 0.2s;box-shadow:var(--shadow)}
.movie-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(245,166,35,0.15)}
.movie-card-inner{display:flex;gap:16px;padding:16px}
.movie-poster{flex-shrink:0;width:100px}
.movie-poster img{width:100px;height:auto;border-radius:6px;display:block}
.movie-info{flex:1;min-width:0}
.movie-info h2{font-size:18px;margin-bottom:4px}
.movie-info h2 a{color:var(--text)}
.movie-info h2 a:hover{color:var(--primary);text-decoration:none}
.movie-meta{font-size:13px;color:var(--text2);margin-bottom:6px}
.imdb-badge{display:inline-block;background:var(--rating-bg);color:var(--rating-color);padding:1px 8px;border-radius:4px;font-weight:700;font-size:12px;margin-right:6px}
.genre-tag{display:inline-block;background:#fdf3e7;color:#b87333;padding:1px 8px;border-radius:4px;font-size:12px;margin:1px 2px}
.movie-desc{font-size:14px;color:var(--text2);margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movie-cinemas{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cinema-chip{display:inline-block;background:#fff5e6;color:#b87333;border:1px solid #f0dcc0;padding:2px 10px;border-radius:12px;font-size:12px}
.showtimes-panel{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface2);display:none}
.showtimes-panel.open{display:block}
.cinema-showtimes{margin-bottom:10px}
.cinema-showtimes h4{font-size:14px;margin-bottom:4px;color:#e85d5d}
.hall-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.hall-table th,.hall-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;vertical-align:top}
.hall-table th{background:#fdf3e7;color:#666;font-weight:600}
.hall-table td .time-slot{display:inline-block;background:#f5a623;color:#fff;padding:2px 8px;border-radius:4px;margin:1px;font-size:11px}
.hall-table td.empty{color:#ccc}
.timeline-header{position:sticky;top:60px;z-index:50;background:var(--bg);padding:8px 0;display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.day-pill{background:var(--surface);border:1px solid var(--border);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--text2);transition:all 0.2s;box-shadow:var(--shadow)}
.day-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-pill:hover{border-color:var(--accent)}
.timeline-day-content{padding:0 4px}
.timeline-cinema-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.timeline-cinema-title{font-size:15px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);color:#e85d5d}
.timeline-movie-entry{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.timeline-movie-entry:last-child{border-bottom:none}
.timeline-movie-entry:hover{background:var(--surface2)}
.timeline-movie-title{font-weight:600;font-size:14px;color:var(--text)}
.timeline-movie-hall{font-size:12px;color:var(--text2)}
.timeline-movie-times{margin-left:auto;font-size:13px;color:#e85d5d;white-space:nowrap}
.cinemas-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cinema-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.cinema-card h3{font-size:16px;margin-bottom:8px;color:#e85d5d}
.cinema-card .addr{font-size:12px;color:var(--text2);margin-bottom:8px}
.cinema-movie{font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.cinema-movie:last-child{border:none}
.cinema-movie-title{font-weight:600;color:var(--text);white-space:nowrap}
.cinema-movie-days{margin-top:2px;display:flex;flex-direction:column;gap:2px;width:100%}
.cinema-day-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.cinema-day{color:#b87333;font-weight:600;font-size:12px}
.cinema-day-times{font-size:12px;color:#e85d5d}
footer{text-align:center;padding:24px;color:var(--text2);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
.movie-poster{cursor:pointer}
.movie-poster img:hover{transform:scale(1.04);transition:transform 0.2s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.2s}
.modal-overlay.open{opacity:1}
.modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.3);transform:translateY(12px);transition:transform 0.2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;gap:16px;padding:16px;border-bottom:1px solid var(--border)}
.modal-poster{flex-shrink:0;width:130px}
.modal-poster img{width:130px;height:auto;border-radius:8px;display:block}
.modal-title-wrap{flex:1;min-width:0}
.modal-title{font-size:20px;line-height:1.3;margin:0 0 6px}
.modal-close{position:sticky;top:8px;float:right;background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;color:var(--text);z-index:2}
.modal-body{padding:16px}
.modal-desc{font-size:14px;color:var(--text);margin-bottom:12px;white-space:pre-wrap}
.modal-facts{font-size:13px;color:var(--text2);margin:6px 0}
.modal-facts b{color:var(--text)}
.modal-trailer{display:inline-block;background:#ff0000;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;margin-top:8px}
.modal-trailer:hover{background:#d00000;color:#fff;text-decoration:none}
@media(max-width:768px){
  .header-inner{flex-direction:column;align-items:stretch}
  nav{justify-content:center}
  .movie-card-inner{flex-direction:column;align-items:center;text-align:center}
  .movie-poster{width:80px}
  .movie-poster img{width:80px}
  .movie-cinemas{justify-content:center}
  .timeline-grid{grid-template-columns:120px 1fr}
}
</style>
</head>

φνικά (All of a Sudden / Soudain)", "detail_url": "https://www.thessalonikiguide.gr/tainia/etsi-xafnika-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/10/etsi-ksafnika-120x180.jpg", "imdb": "8", "genres": ["Δραματική", "Ψυχολογικό Δράμα"], "year": "2026", "description": "Μια γνωριμία δύο γυναικών κι ένας ωκεανός συναισθημάτων. Μια καθηλωτική ταινία για τη φροντίδα και την πραγματική σύνδεση μεταξύ ανθρώπων, που κάνει τον κόσμο να μοιάζει λίγο πιο ανθρώπινος. Η Μαρί-Λου Φονταίν, νέα διευθύντρια ενός οίκου ευγηρίας στο Παρίσι, αγωνίζεται για μια πιο ανθρώπινη φροντίδα των ηλικιωμένων, υιοθετώντας τη μέθοδο «Humanitude», παρά τις αντιστάσεις της ομάδας της. Η γνωριμία της με τη Μαρί Μορισάκι, μια γιαπωνέζα φιλόσοφο, αλλάζει τη ζωή της. Έτσι ξαφνικά. Αντλώντας έμπνευση από την αλληλογραφία μεταξύ ενός άρρωστου φιλόσοφου και μιας ιατρικής ανθρωπολόγου, ο Χαμαγκούτσι γύρισε την ταινία σε ένα υπαρκτό κέντρο φροντίδας, με επαγγελματίες ηθοποιούς να συμπράττουν με πραγματικούς ασθενείς. Το Soudain, που χάρισε και στις δύο πρωταγωνίστριες το Βραβείο της Καλύτερης Γυναικείας Ερμηνείας στο Φεστιβάλ Καννών, είναι μια ταινία 196 λεπτών που καμία της στιγμή δεν αφήνει τον θεατή αδιάφορο. Ο βραβευμένος με Όσκαρ ιάπωνας σκηνοθέτης Ριουσούκε Χαμαγκούτσι (Drive My Car), μας κάνει έκκληση να επιβραδύνουμε, να αγνοήσουμε τους απομονωτικούς μηχανισμούς του ανταγωνισμού και να ακούσουμε τους ανθρώπους γύρω μας.", "cast": "Βιρζινί Εφιρά, Τάο Οκαμότο, Κιοζο Ναγκατσούκα, Ζαν Σαρλ Κλισε, Ρομέν Κοτάρ, Γκαμπριέλ Νταχμανί, Κοντάι Κουτοσάκι, Μαρί Μπουνέλ, Μαρί Ντεναρνο, Ελοΐζ Ζαντζό", "director": "Ριουσούκε Χαμαγκούτσι", "writer": "Ριουσούκε Χαμαγκούτσι, Μαχο Ισόνο, Λέα Λε Ντίμα", "trailer": "https://www.youtube.com/watch?v=BB3Hx3e3tk8", "cinemas": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}], "showtimes": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "p parent, Industry) υποδύεται τον Ντάντο (Daddo), τον πατέρα της Μπέλα, ενώ η Αραμπέλα Ολίβια Κλαρκ (The Housemaid, The Hand that Rocks the Cradle) ενσαρκώνει την Μπέλα. Το εντυπωσιακό καστ συμπληρώνουν η Ντίτσεν Λάχμαν (Dichen Lachman) (Severance), υποψήφια για Actor Award, ο υποψήφιος για Emmy και Tony, Άριαν Μοαγέντ (Succession), καθώς και η θρυλική ηθοποιός Κάρεν Άλεν, γνωστή από τις ταινίες Indiana Jones. Την ταινία Άλλη Μαμά σκηνοθετεί ο Ρομπ Σάβατζ (Host, The Boogeyman), σε σενάριο του βραβευμένου Νέιθαν Έλστον, σεναριογράφου της πολυβραβευμένης με Emmy σειράς: Succession. Την παραγωγή υπογράφει ο Τζέιμς Γουάν (Saw, Insidious και The Conjuring), για λογαριασμό της Blumhouse Atomic Monster, και την εκτέλεση παραγωγής οι Μάικλ Κλιαρ, Τζάντσον Σκοτ, Ρομπ Σάβατζ, Τζος Μάλερμαν και Ράιαν Λιούις.", "cast": "Τζέσικα Τσαστέιν, Τζέι Ντουπλάς, Αραμπέλα Ολίβια Κλαρκ, Ντίτσεν Λάχμαν, Άριαν Μοαγέντ, Κάρεν Άλεν, Σον Κάουφμαν, Τρέιβις Νέλσον, Χάλεϊ Σπίλμαν, Άλεκ Σικαρίνου, Άνταμ Σίλβερ, Ρόζι Άν Ο Γκόρμαν", "director": "Ρομπ Σάβατζ", "writer": "Νέιθαν Ήλστον, Τζος Μέιλερμαν", "trailer": "https://www.youtube.com/watch?v=vMRNxUo0J3s", "cinemas": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}], "showtimes": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/", "address": "Γιαννιτσών 61 & Κωλέττη 34, Θεσσαλονίκη", "phone": "Τηλ. 2310 515351", "halls": [{"name": "Αίθουσα 2", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[["21:30"], ["21:30"], ["21:30"], ["21:30"], ["21:30"], ["21:30"], ["21:30"]]]}]}]}, {"title": "Primetime", "detail_url": "https://www.thessalonikiguide.gr/tainia/primetime-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/09/primetime-120x180.jpg", "imdb": "7", "genres": ["Αστυνομική", "Βιογραφική", "Δραματική", "Ψυχολογικό Δράμα"], "year": "2026", "description": "Το 2006, ο παρουσιασ ι του Κρουζ, ενώ εκτελεστικός παραγωγός είναι ο Τζόσουα Γκρόουντ. Μαζί με τον Ινιάριτου πίσω από την κάμερα βρίσκονται παλιοί συνεργάτες του: ο βραβευμένος με Όσκαρ διευθυντής φωτογραφίας Εμανουέλ Λουμπέζκι, οι μοντέρ Κόνορ Ο’Νιλ και ο βραβευμένος με Όσκαρ Στίβεν Μιριόνε, η υποψήφια για Όσκαρ ενδυματολόγος Ζάκλιν Γουέστ, ο βραβευμένος με Όσκαρ σχεδιαστής μακιγιάζ και κομμώσεων Αλεσάντρο Μπερτολάτσι και η υποψήφια για Όσκαρ διευθύντρια κάστινγκ Φράνσιν Μέισλερ.", "cast": "Τομ Κρουζ, Ριζ Άχμεντ, Σάντρα Χιούλερ, Τζον Γκούντμαν, Μάικλ Σταχλμπαργκ, Ρόμπερτ Τζον Μπέρκ, Έμα ντ΄Άρσυ, Τζέσι Πλέμονς, Μερσέντες Χερνάντεζ, Μπερν Γκόρμαν, Ντάνι Κιράνι, Εθέρια Έιντζελ, Τομ Μπελ, Πιπ Τόρενς", "director": "Αλεχάντρο Γκ. Ιναρίτου", "writer": "Σαμπίνα Μπέρμαν, Τζες Μπάτεργουορθ, Αλεξάντερ Ντινελάρις", "trailer": "https://www.youtube.com/watch?v=VD2JEzmaqmU", "cinemas": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}, {"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/"}], "showtimes": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "phone": "Τηλ. 2310233665, 2310233669", "halls": [{"name": "Αίθουσα 1", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[["22:00"], [], ["22:00"], [], [], [], []]]}, {"name": "Αίθουσα 2", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[[], [], [], ["21:30"], [], [], []]]}]}, {"name": "Απόλλων Θερινός", "url": "https://www.thessalonikiguide.gr/cinemas/apollon/", "address": "Σαρανταπόρου 4, Θεσσαλονίκη", "phone": "Τηλ. 2310 828642", "halls": [{"name": "Αίθουσα", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[[], [], [], [], [], ["20:45"], []]]}]}]}, {"title": "Ο Tad και το Μαγικό Λυχνάρι (Tad and the Magic Lamp)", "detail_url": "https://www.thessalonikiguide.gr/tainia/tad-kai-to-magiko-lyxnari-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/09/tad-kai-to-magiko-lyxnari-120x180.jpg", "imdb": "", "genres": ["Κινούμενα Σχέδια", "Οικογενειακή", "Παιδικό Σινεμά", "Περιπέτεια", "Φαντασίας"], "year": "2026", "description": "Η Όλι, η ατρόμητη δίχρονη κόρη της Σάρα και του Ταντ, τον έχει μεταμορφώσει σε υπερπροστατευτικό πατέρα, ενώ ο Μούμια αισθάνεται παραμελημένος λόγω της προσοχής που λαμβάνει η κόρη. Όταν βρίσκουν το μαγικό λυχνάρι από τις Χίλιες και Μία Νύχτες στο Παλάτι του Μπάκιγχαμ, ο Μούμια τού ζητά να ταξιδέψουν πίσω στο χρόνο στο Παϊτίτι του Περού, το 1502, τότε που ήταν νέος και όλοι τον αγαπούσαν. Ο Ταντ, η Σάρα και όλη η ομάδα θα πρέπει να ακολουθήσουν τον Μούμια στο παρελθόν, πριν αυτός αλλάξει την πορεία της ιστορίας… Το ταξίδι τους θα τους οδηγήσει πέρα από τον Ατλαντικό Ωκεανό, από το Περού στην Ελλάδα, και από εκεί βαθιά στη Μέση Ανατολή, μέχρι τη σπηλιά του Αλί Μπαμπά και των Σαράντα Κλεφτών.", "cast": "Με τις φωνές των: Ανδρέας Τσέλεπος, Άρης Κυπριανού, Νίκη Δραγούμη, Ιωάννα Παπαμιχαλοπούλου, Μάριαν Κυπριανού, Γιώργος Λίζος, Μιχάλης Καζάκας, Μυρσίνη Χριστοδούλου, Νικόλας Κουρουζίδης, Πέτρος Κονόμου, Θανάσης Δρακόπουλος, Ορφέας Σολωμού", "director": "Ενρίκε Γκάτο", "writer": "Μανουέλ Μπουρκέ, Τζοσεπ Γκατέλ", "trailer": "https://www.youtube.com/watch?v=teSvPCHLIug", "cinemas": [{"name": "Δημ. Κιν. Νεάπολης - Συκεών", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-neapolis-sykeon/"}, {"name": "Δημ. Κιν. Κορδελιού - Εύοσμου", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-kordelio-evosmos/"}], "showtimes": [{"name": "Δημ. Κιν. Νεάπολης - Συκεών", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-neapolis-sykeon/", "address": "Ρήγα Φεραίου και Μεγάρων, Συκιές, Θεσσαλονίκη", "phone": "Τηλ. 2310 635 725, 2313 329 540", "halls": [{"name": "(Μεταγλ.)", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 1 : "7,5", "genres": ["Sci-Fi", "Αγωνίας", "Δράσης", "Τρόμου", "Ψυχολογικό Δράμα"], "year": "2026", "description": "Από το μυαλό του οραματιστή σκηνοθέτη Zach Cregger (Weapons, Barbarian) έρχεται μια συναρπαστική και τρομακτική νέα ταινία της σειράς ταινιών Resident Evil. Σε μια ολοκαίνουρια ιστορία, η ταινία ακολουθεί τον Μπράιαν (Όστιν Έιμπραμς), έναν ιατρικό κούριερ που, χωρίς να το θέλει, βρίσκεται μπλεγμένος σε έναν ασταμάτητο αγώνα επιβίωσης, καθώς μια μοιραία, φρικιαστική νύχτα διαλύει τα πάντα γύρω του και το χάος επικρατεί.", "cast": "Όστιν Έιμπραμς, Κάλι Ρέις, Πόλ Γουόλτερ Χάουζερ, Ζακ Τσέρι, Τζόνο Γουίλσον, Ντέβον Στιούαρτ, Σον Γ. Λόιζερ", "director": "Ζακ Κρέγκερ", "writer": "Ζακ Κρέγκερ, Σάι Χέιτεν", "trailer": "https://www.youtube.com/watch?v=J_pTN4R5Ooo", "cinemas": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}], "showtimes": [{"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/", "address": "Γιαννιτσών 61 & Κωλέττη 34, Θεσσαλονίκη", "phone": "Τηλ. 2310 515351", "halls": [{"name": "Αίθουσα 3", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[["21:15", "23:10"], ["21:15", "23:10"], ["21:15", "23:10"], ["21:15", "23:10"], ["21:15", "23:10"], ["21:15", "23:10"], ["21:15", "23:10"]]]}]}]}, {"title": "Ξεχασμένο Νησί (Forgotten Island)", "detail_url": "https://www.thessalonikiguide.gr/tainia/xehasmeno-nhsi-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/10/xehasmeno-nisi-120x180.jpg", "imdb": "7,5", "genres": ["Δράσης", "Ενηλικίωσης: Coming of Age", "Κινούμενα Σχέδια", "Κωμωδία", "Οικογενειακή", "Παιδικό Σινεμά", "Περιπέτεια", "Φαντασίας"], "year": "2026", "description": "Αξίζει να παλέψεις για την κολλητή σου. Η DreamWorks Animation παρουσιάζει μια καθηλωτική και συγκινητική ιστορία για δύο κολλητές φίλες που πρέπει να ενωθούν ξανά πριν απομακρυνθούν οριστικά, στο Ξεχασμένο Νησί. Η βραβευμένη με Grammy και Όσκαρ H.E.R. και η Λίζα Σομπεράνο (Lisa Frankenstein, Alone/Together) δίνουν τις φωνές τους στις απόφοιτες λυκείου Τζο και Ράισα, που είναι κολλητές φίλες από το δημοτικό, αλλά τώρα βρίσκονται μπροστά σε διαφορετικά μονοπάτια. Καθώς γιορτάζουν την τελευταία τους νύχτα μαζί, η Τζο και η Ράισα ανακαλύπτουν μια μυστηριώδη πύλη που τις μεταφέρει στο φανταστικό νησί Νακάλι, γεμάτο μαγικά και μυθικά πλάσματα για τα οποία άκουγαν ιστορίες από τους Φιλιππινέζους συγγενείς τους. Μερικά από αυτά τα πλάσματα θα γίνουν φίλοι, άλλα εχθροί. Μαζί με έναν καλοπροαίρετο αλλά αδέξιο άνθρωπο-σκύλο και μια μικρή αλλά δυναμική παρέα φίλων, η Τζο και η Ράισα πρέπει να αντιμετωπίσουν το πιο φοβερό πλάσμα του νησιού. Όταν ανακαλύπτουν ότι το τίμημα για να επιστρέψουν πίσω είναι να θυσιάσουν τις αναμνήσεις ολόκληρης της φιλίας τους, η Τζο και η Ράισα θα αναμετρηθούν με τον χρόνο για να φύγουν από το νησί πριν ξεχάσουν η μία την άλλη για πάντα. Με τις φωνές των: H.E.R., Λίζα Σομπεράνο, Ντέιβ Φράνκο, Λία Σαλόνγκα, Τζένι Σλέιτ, Μάνι Τζασίντο, Ντόλι ντε Λεόν, Τζο Κόι, Ρόνι Τσιενγκ, Κέβιν ΜακΚαν, Γιουτζίν Κορδέρο, Κάιλι Κρόφορντ, Κέιλα Τερουέλ", "cast": "Με τις φωνές των: Πηνελόπη Σκαλκώτου, Ορέστης Χαλκιάς, Δήμητρα Βλαγκοπούλου, Μιχάλης Τιτόπουλος, Ησαΐας Ματιάμπα, Ελλη Θάνου, Γλυκερία Χασάπη, Αλεξάνδρα Λέρτα", "director": "Τζόελ Κρόφορντ, Ζανουέλ Π. Μερκάντο", "writer": "Τζόελ Κρόφορντ, Ζανουέλ Π. Μερκάντο", "trailer": "https://www.youtube.com/watch?v=ZoJgneG9FbI", "cinemas": [{"name": "Δημ. Κιν. Νεάπολης - Συκεών", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-neapolis-sykeon/"}, {"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/"}], "showtimes": [{"name": "Δημ. Κιν. Νεάπολης - Συκεών", "url": "https://www.thessalonikiguide.gr/cinemas/dimotiko-cinema-neapolis-sykeon/", "address": "Ρήγα Φεραίου και Μεγάρων, Συκιές, Θεσσαλονίκη", "phone": "Τηλ. 2310 635 725, 2313 329 540", "halls": [{"name": "(Μεταγλ.)", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[[], [], [], ["11:30"], [], [], []]]}]}, {"name": "Cineplexx One Salonica", "url": "https://www.thessalonikiguide.gr/cinemas/one-salonica/", "address": "Γιαννιτσών 61 & Κωλέττη 34, Θεσσαλονίκη", "phone": "Τηλ. 2310 515351", "halls": [{"name": "Αίθουσα 6 (Μεταγλ.)", "days": ["Πε 5/11", "Πα 6/11", "Σα 7/11", "Κυ 8/11", "Δε 9/11", "Τρ 10/11", "Τε 11/11"], "showtimes": [[[], [], ["16:00"], ["16:00"], [], [], []]]}]}]}, {"title": "Naza", "detail_url": "https://www.thessalonikiguide.gr/tainia/naza-2026/", "poster": "https://www.thessalonikiguide.gr/wp-content/uploads/2026/09/naza-documentary-120x180.jpg", "imdb": "8,3", "genres": ["Ντοκιμαντέρ", "Πολεμική"], "year": "2026", "description": "Σε μυστικές νυχτερινές συνομιλίες στις ταράτσες του Τελ Αβίβ, τα συστήματα πίσω από την οργανωμένη μαζική εξόντωση Παλαιστινίων αμάχων στη Γάζα από το Ισραήλ έρχονται στο φως από τις φωνές των ίδιων ανθρώπων που τα σχεδίασαν και χρησιμοποίησαν. Γυρισμένο κυρίως τη νύχτα σε ταράτσες του Τελ Αβίβ, το ντοκιμαντέρ βασίζεται σε ανώνυμες συνεντεύξεις με 24 μέλη των ισραηλινών υπηρεσιών πληροφοριών και του στρατού. Μέσα από τις μαρτυρίες τους εξετάζει τα συστήματα επιλογής στόχων, τη χρήση εργαλείων που αξιοποιούν τεχνητή νοημοσύνη και τον τρόπο με τον οποίο υπολογίζονταν οι αναμενόμενες απώλειες αμάχων πριν από αεροπορικά πλήγματα. Η ταινία στηρίζεται επίσης σε δημοσιογραφικές έρευνες που δημοσιεύτηκαν από το 2023 έως το 2025 στον Guardian, το +972 Magazine και το Local Call. Σημείωμα των σκηνοθετών: Κάναμε αυτή την ταινία από αίσθηση χρέους: να αξιοποιήσουμε τη θέση μας ως Ισραηλινοί κινηματογραφιστές και δημοσιογράφοι, ώστε να εξετάσουμε τα συστήματα πίσω από τη μαζική εξόντωση Παλαιστινίων αμάχων, για την οποία ευθύνεται η χώρα μας. Καθώς γυρίζαμε, τα τελευταία τρία χρόνια, μέλη του ισραηλινού στρατού σε ταράτσες του Τελ Αβίβ μέσα στη νύχτα, βρεθήκαμε να θέτουμε τα ίδια ακριβώς ερωτήμ ά από τον Τρωικό Πόλεμο, όπου συναντά τον Κύκλωπα Πολύφημο, τις Σειρήνες και την μάγισσα θεά Κίρκη, ως και την επανένωσή του με τη γυναίκα του, Πηνελόπη και τον γιο του Τηλέμαχο. Τα γυρίσματα της ταινίας Οδύσσεια του 2026, ξεκίνησαν τον Φεβρουάριο του 2025, στο Μαρόκο, στην Ιταλία, στην Ελλάδα, Ηνωμένο Βασίλειο, Μάλτα, Σκωτία, Ισλανδία, Σαχάρα και οι τελευταίες σκηνές πραγματοποιήθηκαν στο Λος Άντζελες. Με υπολογισμένο κόστος παραγωγής τα $250 εκατομμύρια, θα είναι η πιο ακριβή ταινία του Νόλαν. Τα γυρίσματα διήρκεσαν 91 ημέρες, από τον Φεβρουάριο έως τον Αύγουστο του 2025, και ολοκληρώθηκαν εννέα ημέρες νωρίτερα από το χρονοδιάγραμμα. Τα γυρίσματα σε εξωτερικούς χώρους πραγματοποιήθηκαν κυρίως σε έξι χώρες: το Μαρόκο, την Ελλάδα, την Ιταλία, την Ισλανδία, τη Σκωτία και τις Ηνωμένες Πολιτείες. Η «Οδύσσεια» έγινε η πρώτη ταινία μεγάλου μήκους που γυρίστηκε εξ ολοκλήρου με κινηματογραφικές κάμερες IMAX, χρησιμοποιώντας κυρίως μια νέα, ελαφρύτερη και πιο αθόρυβη έκδοση που ο Νόλαν είχε αναπτύξει ειδικά για την παραγωγή. Η επιλογή της Κενυάτισσας ηθοποιού Λουπίτα Νιόνγκο για τον ρόλο της Ωραίας Ελένης —που θεωρείται η ομορφότερη γυναίκα στον κόσμο— δέχτηκε ιδιαίτερη κριτική από συντηρητικούς σχολιαστές.", "cast": "Ματ Ντέιμον, Τομ Χόλαντ, Αν Χάθαγουεϊ, Ρόμπερτ Πάτινσον, Λουπίτα Νιόνγκο, Ζεντάγια, Σαρλίζ Θερόν, Τζον Μπέρνθαλ, Έλιοτ Πέιτζ, Ράιαν Χερστ, Τζον Στιούαρτ, Λόγκαν Μάρσαλ Γκριν, Μία Γκοθ, Τζον Λεγκουιζάμο, Τζέιμς Ρεμαρ, Σαμάνθα Μόρτον, Μπένι Σαφντι", "director": "Κρίστοφερ Νόλαν", "writer": "Κρίστοφερ Νόλαν, βασισμένο στο Ομηρικό Έπος Οδύσσεια", "trailer": "https://www.youtube.com/watch?v=YJw4t5gpMB8", "cinemas": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/"}, {"name": "Odeon Πλατεία", "url": "https://www.thessalonikiguide.gr/cinemas/odeon-plateia/"}], "showtimes": [{"name": "Βακούρα", "url": "https://www.thessalonikiguide.gr/cinemas/vakoura/", "address": "Ιωάννου Μιχαήλ 8, Θεσσαλονίκη", "phone": "Τηλ. 2310233665, 2310233669", "h       el('h4',{},summerIcon(c.name)),
      c.address ? el('div',{style:'font-size:11px;color:var(--text2);margin-bottom:4px'},c.address) : null
    );
    for (const hall of (c.halls||[])) {
      if (!hall.days || !hall.days.length) continue;
      const table = el('table',{className:'hall-table'});
      const thead = el('tr');
      for (const d of hall.days) thead.append(el('th',{},d));
      table.append(thead);
      for (const rowTimes of (hall.showtimes||[])) {
        const tr = el('tr');
        for (let i = 0; i < Math.max(hall.days.length, rowTimes.length); i++) {
          const times = rowTimes[i] || [];
          if (!times.length) { tr.append(el('td',{className:'empty'},'—')); }
          else { const td = el('td',{}); for (const t of times) td.append(el('span',{className:'time-slot'},t)); tr.append(td); }
        }
        table.append(tr);
      }
      block.append(table);
    }
    panel.append(block);
  }
}

function showMovieModal(m) {
  const existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  const overlay = el('div',{className:'modal-overlay'});
  const closeBtn = el('button',{className:'modal-close','aria-label':'Κλείσιμο'},'×');
  const ps = m.poster && !m.poster.includes('data:image') ? m.poster : '';
  const imdbH = m.imdb ? '<span class="imdb-badge">IMDb '+esc(m.imdb)+'</span>' : '';
  const trailerUrl = m.trailer || 'https://www.youtube.com/results?search_query='+encodeURIComponent(m.title+' trailer');
  const facts = [];
  if (m.year) facts.push(el('p',{className:'modal-facts'},el('b',{},'Έτος: '),m.year));
  if (m.director) facts.push(el('p',{className:'modal-facts'},el('b',{},'Σκηνοθεσία: '),m.director));
  if (m.writer) facts.push(el('p',{className:'modal-facts'},el('b',{},'Σενάριο: '),m.writer));
  if (m.cast) facts.push(el('p',{className:'modal-facts'},el('b',{},'Ηθοποιοί: '),m.cast));
  const genres = (m.genres||[]).map(g => el('span',{className:'genre-tag'},g));
  const modal = el('div',{className:'modal'},
    el('div',{className:'modal-header'},
      closeBtn,
      el('div',{className:'modal-poster'}, ps ? el('img',{src:ps,alt:m.title}) : null),
      el('div',{className:'modal-title-wrap'},
        el('h2',{className:'modal-title'},m.title),
        el('div',{className:'movie-meta',innerHTML:imdbH}),
        el('div',{style:'margin-top:4px'},...genres)
      )
    ),
    el('div',{className:'modal-body'},
      m.description ? el('p',{className:'modal-desc'},m.description) : null,
      ...facts,
      el('a',{className:'modal-trailer',href:trailerUrl,target:'_blank',rel:'noopener'},'▶ Δείτε τρέιλερ')
    )
  );
  overlay.append(modal);
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  function close() {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 200);
  }
  closeBtn.onclick = close;
  document.addEventListener('keydown', function escKey(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escKey); }
  });
}

function renderColumnView(data) {
  data = data || MOVIES_DATA;
  const container = el('div',{className:'movies-grid'});
  for (const m of data) {
    const ps = m.poster && !m.poster.includes('data:image') ? m.poster : '';
    const gens = (m.genres||[]).slice(0,4).map(g => el('span',{className:'genre-tag'},g));
    const chips = (m.cinemas||[]).map(c => el('span',{className:'cinema-chip'},summerIcon(c.name)));
    const imdbH = m.imdb ? '<span class="imdb-badge">IMDb '+esc(m.imdb)+'</span>' : '';
    const panel = el('div',{className:'showtimes-panel'});
    const btn = el('button',{className:'showtimes-toggle',style:'background:none;border:none;color:#e85d5d;cursor:pointer;font-size:13px;margin-top:6px;padding:2px 0;font-weight:600'},'ώρες Προβολών ▼');
    let open = false;
    btn.onclick = async () => {
      open = !open;
      panel.classList.toggle('open', open);
      btn.textContent = open ? 'ώρες Προβολών ▲' : 'ώρες Προβολών ▼';
      if (open && !panel.hasChildNodes()) {
        let st = m.showtimes;
        if ((!st || !st.length) && m.detail_url) {
          if (SHOWTIMES_CACHE.has(m.detail_url)) {
            st = SHOWTIMES_CACHE.get(m.detail_url);
          } else {
            btn.textContent = 'Φόρτωση...';
            st = await fetchShowtimesForMovie(m.detail_url);
            if (st) { SHOWTIMES_CACHE.set(m.detail_url, st); m.showtimes = st; }
          }
        }
        renderShowtimes(panel, st||[]);
      }
    };
    const card = el('div',{className:'movie-card'},
      el('div',{className:'movie-card-inner'},
        el('div',{className:'movie-poster',onclick:()=>showMovieModal(m),title:m.title}, ps ? el('img',{src:ps,alt:m.title,loading:'lazy'}) : el('span',{className:'genre-tag'},'No Poster')),
        el('div',{className:'movie-info'},
          el('h2',{}, m.title),
          el('div',{className:'movie-meta',innerHTML:imdbH+(m.year?' <span>'+esc(m.year)+'</span>':'')}),
          el('div',{className:'movie-meta'},...gens),
          m.description ? el('div',{className:'movie-desc'},m.description) : null,
          el('div',{className:'movie-cinemas'},...chips),
          btn
        )
      ),
      panel
    );
    container.append(card);
  }
  return container;
}

function getTimesForMovieDay(movie, dayLabel) {
  const result = [];
  for (const c of (movie.showtimes||[])) {
    for (const hall of (c.halls||[])) {
      const dayIdx = (hall.days||[]).findIndex(d => d.includes(dayLabel));
      if (dayIdx < 0) continue;
      const times = new Set();
      for (const row of (hall.showtimes||[])) {
        if (row[dayIdx] && row[dayIdx].length) for (const t of row[dayIdx]) times.add(t);
      }
      if (times.size) result.push({cinema: c.name, hall: hall.name, times: [...times]});
    }
  }
  return result;
}

function renderTimelineView() {
  const container = el('div',{});
  const dayHeader = el('div',{className:'timeline-header'});
  const dAbbrs = ['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'];
  const today = new Date();
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const idx = d.getDay() === 0 ? 6 : d.getDay() - 1;
    weekDays.push({date:d, abbr:dAbbrs[idx], label:dAbbrs[idx]+' '+d.getDate()+'/'+(d.getMonth()+1)});
  }
  let activeDay = 0;
  function buildDayContent(dayIdx) {
    const dayLabel = weekDays[dayIdx].abbr;
    const wrapper = el('div',{className:'timeline-day-content'});
    const cinemaMap = {};
    for (const m of MOVIES_DATA) {
      const entries = getTimesForMovieDay(m, dayLabel);
      for (const e of entries) {
        if (!cinemaMap[e.cinema]) cinemaMap[e.cinema] = [];
        cinemaMap[e.cinema].push({title:m.title, hall:e.hall, times:e.times, movie:m});
      }
    }
    if (!Object.keys(cinemaMap).length) {
      wrapper.append(el('p',{style:'color:var(--text2);text-align:center;padding:24px'},'Δεν υπάρχουν προβολές για αυτή την ημέρα.'));
      return wrapper;
    }
    for (const [cn, items] of Object.entries(cinemaMap).sort()) {
      const section = el('div',{className:'timeline-cinema-section'},
        el('h3',{className:'timeline-cinema-title'},summerIcon(cn))
      );
      for (const item of items) {
        const entry = el('div',{className:'timeline-movie-entry'});
        entry.append(el('span',{className:'timeline-movie-title'},item.title));
        if (item.hall !== 'Αίθουσα') entry.append(el('span',{className:'timeline-movie-hall'},'('+item.hall+')'));
        entry.append(el('span',{className:'timeline-movie-times'},item.times.join(', ')));
        entry.onclick = () => { document.querySelectorAll('.tab')[0].click(); setTimeout(()=>{for(const card of document.querySelectorAll('.movie-card')){if(card.textContent.includes(item.title)){card.scrollIntoView({behavior:'smooth',block:'center'});const b=card.querySelector('.showtimes-toggle');if(b)b.click();break}}},100) };
        section.append(entry);
      }
      wrapper.append(section);
    }
    return wrapper;
  }
  for (let i = 0; i < weekDays.length; i++) {
    const pill = el('button',{className:'day-pill'+(i===activeDay?' active':''),textContent:weekDays[i].label});
    pill.onclick = () => { dayHeader.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); activeDay = i; const old=container.querySelector('.timeline-day-content'); if(old) old.remove(); container.append(buildDayContent(activeDay)); };
    dayHeader.append(pill);
  }
  container.append(dayHeader);
  container.append(buildDayContent(0));
  return container;
}

function getShowtimesForCinema(movie, cinemaName) {
  const st = (movie.showtimes||[]).find(c => c.name === cinemaName);
  if (!st || !st.halls || !st.halls.length) return null;
  const dayMap = {};
  for (const hall of st.halls) {
    const days = hall.days || [];
    const rows = hall.showtimes || [];
    for (let di = 0; di < days.length; di++) {
      if (!dayMap[days[di]]) dayMap[days[di]] = new Set();
      for (const row of rows) {
        if (row[di] && row[di].length) for (const t of row[di]) dayMap[days[di]].add(t);
      }
    }
  }
  return dayMap;
}

function renderCinemasView() {
  const container = el('div',{className:'cinemas-list'});
  const cm = {};
  for (const m of MOVIES_DATA) {
    for (const c of (m.cinemas||[])) {
      if (!cm[c.name]) cm[c.name] = {name:c.name, entries:[]};
      cm[c.name].entries.push(m);
    }
  }
  for (const [name,data] of Object.entries(cm).sort()) {
    const card = el('div',{className:'cinema-card'},el('h3',{},summerIcon(name)));
    for (const m of data.entries) {
      const line = el('div',{className:'cinema-movie'});
      line.append(el('span',{className:'cinema-movie-title'},m.title));
      const dayMap = getShowtimesForCinema(m, name);
      const timesWrap = el('div',{className:'cinema-movie-days'});
      if (dayMap && Object.keys(dayMap).length) {
        for (const [dayLabel, times] of Object.entries(dayMap)) {
          const dayLine = el('div',{className:'cinema-day-line'});
          dayLine.append(el('span',{className:'cinema-day'},dayLabel + ': '));
          dayLine.append(el('span',{className:'cinema-day-times'},[...times].join(', ')));
          timesWrap.append(dayLine);
        }
      }
      line.append(timesWrap);
      card.append(line);
    }
    container.append(card);
  }
  return container;
}

// ---- Refresh logic ----

async function tryFetch(url, timeoutMs) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(id);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.text();
  } catch(e) {
    clearTimeout(id);
    throw e;
  }
}

async function fetchShowtimesForMovie(url) {
  const slug = url.split('/').filter(s=>s).pop();
  try {
    const txt = await tryFetch('http://localhost:8765/api/movies/'+slug, 5000);
    const data = JSON.parse(txt);
    if (data && data.cinemas && data.cinemas.length) return data.cinemas;
  } catch(e) { /* backend not available */ }
  // CORS proxy fallback (may not work with this site)
  let html = '';
  for (const proxy of CORS_PROXIES) {
    try { html = await tryFetch(proxy + encodeURIComponent(url), 15000); if (html.length > 2000) break; }
    catch(e) { continue; }
  }
  if (!html || html.length < 2000 || !html.includes('python-table')) return [];
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = doc.querySelectorAll('table.python-table.text-center');
  const cinemas = [];
  for (const table of tables) {
    const container = table.closest('.cine-table-sc') || table.parentElement;
    const prev = container?.previousElementSibling;
    const cinemaNameEl = prev?.querySelector('h4, h3, strong, .title') || prev;
    const cinemaName = cinemaNameEl ? cinemaNameEl.textContent.trim() : 'Αίθουσα';
    const addrEl = prev?.querySelector('.address, .addr, [class*="address"], [class*="addr"], p');
    const address = addrEl ? addrEl.textContent.trim() : '';
    const cinema = { name: cinemaName, address, halls: [] };
    const tbody = table.querySelector('tbody');
    if (!tbody) continue;
    const rows = tbody.querySelectorAll('tr');
    if (rows.length < 2) continue;
    const dayCells = rows[1].querySelectorAll('th, td');
    let days = [...dayCells].map(c => c.textContent.trim()).filter(Boolean);
    if (!days.length) {
      for (let i = 0; i < (rows[0]?.querySelectorAll('th, td').length || 7); i++) days.push('Ημέρα '+(i+1));
    }
    const hallGroups = [];
    let i = 0;
    while (i < rows.length) {
      const rowCells = rows[i].querySelectorAll('th, td');
      let hallName = '';
      let colspan = 0;
      for (const cell of rowCells) {
        const cs = parseInt(cell.getAttribute('colspan') || '1');
        colspan += cs;
        const txt = cell.textContent.trim();
        if (cs >= 4 && txt && !txt.match(/^\d{1,2}:\d{2}/)) hallName = txt;
      }
      if (colspan >= 4 && hallName) {
        const group = { name: hallName, rows: [] };
        i++;
        while (i < rows.length) {
          const nextCells = rows[i].querySelectorAll('td');
          if (nextCells.length < 4) break;
          const timeRow = [];
          for (const cell of nextCells) {
            const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
            timeRow.push(times.length ? times : []);
          }
          group.rows.push(timeRow);
          i++;
        }
        hallGroups.push(group);
      } else {
        i++;
      }
    }
    if (!hallGroups.length && days.length) {
      const showtimes = [];
      for (let r = 2; r < rows.length; r++) {
        const timeRow = [];
        for (const cell of rows[r].querySelectorAll('td')) {
          const times = [...cell.querySelectorAll('span')].map(s => s.textContent.trim()).filter(t => t.match(/^\d{1,2}:\d{2}/));
          timeRow.push(times.length ? times : []);
        }
        if (timeRow.some(t => t.length)) showtimes.push(timeRow);
      }
      if (showtimes.length) cinema.halls.push({ name: 'Αίθουσα', days, showtimes });
    } else {
      for (const g of hallGroups) cinema.halls.push({ name: g.name, days, showtimes: g.rows });
    }
    cinemas.push(cinema);
  }
  return cinemas;
}



async function refreshFromGitHub() {
  if (!GITHUB_USER || GITHUB_USER.startsWith('YOUR')) return;
  try {
    const r = await fetch(GITHUB_DATA_URL, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    const data = await r.json();
    if (Array.isArray(data) && data.length && data[0].showtimes) {
      MOVIES_DATA.length = 0;
      SHOWTIMES_CACHE.clear();
      for (const m of data) MOVIES_DATA.push(m);
      const now = new Date();
      document.querySelector('.last-update').textContent =
        now.getDate().toString().padStart(2,'0')+'/'+
        ((now.getMonth()+1).toString().padStart(2,'0'))+'/'+
        now.getFullYear()+' '+now.getHours().toString().padStart(2,'0')+':'+
        now.getMinutes().toString().padStart(2,'0');
    }
  } catch(e) { /* offline or not configured */ }
}

function init() {
  const content = document.getElementById('content');
  content.append(renderColumnView());
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      content.innerHTML = '';
      const v = tab.dataset.view;
      if (v === 'column') content.append(renderColumnView());
      else if (v === 'timeline') content.append(renderTimelineView());
      else content.append(renderCinemasView());
    };
  });
  refreshFromGitHub();
}
init();
